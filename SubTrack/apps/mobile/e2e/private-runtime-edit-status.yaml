appId: se.subtrack.app
---
# Parent acceptance ends with acknowledged logout. Start with fresh verification.
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Example streaming(?:, 129,90[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- scrollUntilVisible:
    element: ${MAESTRO_EDIT}
    direction: DOWN
- tapOn: ${MAESTRO_EDIT}
- scrollUntilVisible:
    element:
      id: native-subscription-name
    direction: UP
- tapOn:
    id: native-subscription-name
- eraseText
- inputText: Example streaming Plus
- hideKeyboard
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- tapOn:
    id: native-subscription-date
- extendedWaitUntil:
    visible: ${MAESTRO_DATE_CLEAR}
    timeout: 30000
- tapOn: ${MAESTRO_DATE_CLEAR}
- extendedWaitUntil:
    notVisible: ${MAESTRO_DATE_CLEAR}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_SAVE_EDIT}
    direction: DOWN
- tapOn: ${MAESTRO_SAVE_EDIT}
- scrollUntilVisible:
    element:
      id: native-personal-title
    direction: UP
- assertVisible:
    id: native-personal-title
    text: ${MAESTRO_PERSONAL_TITLE}
- extendedWaitUntil:
    visible: ${MAESTRO_EDIT_SAVED}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- assertVisible: Example streaming Plus
- takeScreenshot: accepted-edit
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Example streaming Plus(?:, 129,90[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- scrollUntilVisible:
    element: ${MAESTRO_PAUSE}
    direction: DOWN
- tapOn: ${MAESTRO_PAUSE}
- extendedWaitUntil:
    visible: ${MAESTRO_RESUME}
    timeout: 30000
- takeScreenshot: accepted-paused
- tapOn: ${MAESTRO_RESUME}
- extendedWaitUntil:
    visible: ${MAESTRO_PAUSE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_MARK_CANCELLED}
    direction: DOWN
- tapOn: ${MAESTRO_MARK_CANCELLED}
- extendedWaitUntil:
    visible: ${MAESTRO_ARCHIVE}
    timeout: 30000
- assertNotVisible: ${MAESTRO_PAUSE}
- assertNotVisible: ${MAESTRO_RESUME}
- scrollUntilVisible:
    element: ${MAESTRO_ARCHIVE}
    direction: DOWN
- tapOn: ${MAESTRO_ARCHIVE}
- extendedWaitUntil:
    notVisible: ${MAESTRO_ARCHIVE}
    timeout: 30000
- takeScreenshot: accepted-archived
- tapOn:
    id: native-subscription-detail-close
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${MAESTRO_CREATE_ACCOUNT}
    timeout: 120000
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- assertNotVisible: Example streaming Plus
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming Plus
    timeout: 30000
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Example streaming Plus(?:, 129,90[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- assertVisible: ${MAESTRO_EDIT}
- assertNotVisible: ${MAESTRO_ARCHIVE}
- assertVisible: ${MAESTRO_MONTH_DETAIL_PRICE}
- takeScreenshot: accepted-edited-restart
- tapOn:
    id: native-subscription-detail-close
