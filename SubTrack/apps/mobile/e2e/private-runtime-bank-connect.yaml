appId: se.subtrack.app
---
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible: ${MAESTRO_VERIFY_BANKID}
    timeout: 30000
- tapOn: ${MAESTRO_VERIFY_BANKID}
- extendedWaitUntil:
    visible: Native edited restart proof
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_OPEN}
    direction: UP
- tapOn: ${MAESTRO_BANK_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_TITLE}
    timeout: 30000
- assertVisible: ${MAESTRO_BANK_DEMO}
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_EMPTY}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_CONNECT}
    direction: DOWN
- tapOn: ${MAESTRO_BANK_CONNECT}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_ACTIVE}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_ACTIVE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_NEVER}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_NEVER}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_ACCOUNTS}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_ACCOUNTS}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_TRANSACTIONS}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_TRANSACTIONS}
    timeout: 30000
- assertVisible: "1"
- assertVisible: "0"
