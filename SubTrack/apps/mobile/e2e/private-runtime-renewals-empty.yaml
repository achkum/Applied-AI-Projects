appId: se.subtrack.app
---
# Previous parent flow ends logged out. Verify fresh authority, then open agenda.
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming Plus
    timeout: 30000
- tapOn:
    id: native-nav-month
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_RENEWALS_OPEN}
    direction: DOWN
- tapOn: ${MAESTRO_RENEWALS_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_RENEWALS_TITLE}
    timeout: 30000
- extendedWaitUntil:
    visible: ${MAESTRO_RENEWALS_EMPTY}
    timeout: 30000
- assertNotVisible: Example streaming Plus
- scrollUntilVisible:
    element: ${MAESTRO_RENEWALS_TITLE}
    direction: UP
    centerElement: true
- swipe:
    from:
      id: native-renewals-scroll
    direction: DOWN
    duration: 700
- extendedWaitUntil:
    visible: ${MAESTRO_RENEWALS_EMPTY}
    timeout: 30000
- assertNotVisible: Example streaming Plus
- takeScreenshot: accepted-renewals-empty
- tapOn:
    id: native-nav-manage
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- runFlow: private-runtime-open-profile.yaml
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming Plus
