appId: se.subtrack.app
---
- stopApp
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${MAESTRO_CREATE_ACCOUNT}
          timeout: 120000
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible: ${MAESTRO_VERIFY_BANKID}
    timeout: 30000
- assertNotVisible: Native restart proof
- tapOn: ${MAESTRO_VERIFY_BANKID}
- extendedWaitUntil:
    visible: Native restart proof
    timeout: 30000
- scrollUntilVisible:
    element: Native restart proof
    direction: DOWN
    centerElement: true
- takeScreenshot: accepted-restart
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: Native restart proof
- takeScreenshot: accepted-logout
