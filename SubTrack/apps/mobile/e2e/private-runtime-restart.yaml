appId: se.subtrack.app
---
- stopApp
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${MAESTRO_CREATE_ACCOUNT}
          timeout: 120000
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- assertNotVisible: Example streaming
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- takeScreenshot: accepted-restart
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming
- takeScreenshot: accepted-logout
