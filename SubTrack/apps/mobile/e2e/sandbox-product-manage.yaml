appId: se.subtrack.app.sandbox
---
- scrollUntilVisible:
    element: Birch Cinema
    direction: DOWN
- assertVisible: Birch Cinema
- scrollUntilVisible:
    element: Cedar Video
    direction: DOWN
- assertVisible: Cedar Video
- takeScreenshot: accepted-sandbox-subscriptions
- tapOn: Cedar Video
- scrollUntilVisible:
    element: ${E_EDIT}
    direction: DOWN
- tapOn: ${E_EDIT}
- scrollUntilVisible:
    element:
      id: native-subscription-name
    direction: UP
- tapOn:
    id: native-subscription-name
- eraseText
- inputText: Cedar Video Plus
- hideKeyboard
- tapOn:
    id: native-subscription-category
- eraseText
- inputText: Streaming extras
- hideKeyboard
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- tapOn:
    id: native-subscription-date
- tapOn: ${E_TODAY}
- assertVisible: ${TODAY}
- takeScreenshot: accepted-sandbox-edit
- scrollUntilVisible:
    element: ${E_SAVE_EDIT}
    direction: DOWN
- tapOn: ${E_SAVE_EDIT}
- scrollUntilVisible:
    element:
      id: native-personal-title
    direction: UP
- extendedWaitUntil:
    visible: ${E_EDIT_SAVED}
    timeout: 30000
- scrollUntilVisible:
    element: Cedar Video Plus
    direction: DOWN
- assertVisible: Streaming extras
# Saving returns to the list; open the acknowledged saved row once.
- tapOn: Cedar Video Plus
- scrollUntilVisible:
    element: ${E_PAUSE}
    direction: DOWN
- tapOn: ${E_PAUSE}
- extendedWaitUntil:
    visible: ${E_RESUME}
    timeout: 30000
- tapOn: ${E_RESUME}
- extendedWaitUntil:
    visible: ${E_PAUSE}
    timeout: 30000
- assertNotVisible: ${E_RESUME}
- tapOn:
    id: native-subscription-detail-close
