appId: se.subtrack.app.sandbox
---
- scrollUntilVisible:
    element: Disney[+] Standard
    direction: DOWN
- assertVisible: Disney[+] Standard
- scrollUntilVisible:
    element: Netflix
    direction: DOWN
- assertVisible: Netflix
- takeScreenshot: accepted-sandbox-subscriptions
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Netflix(?:, 129,00[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- scrollUntilVisible:
    element: ${E_EDIT}
    direction: DOWN
- tapOn: ${E_EDIT}
- scrollUntilVisible:
    element:
      id: native-subscription-name
    direction: UP
- tapOn:
    id: native-subscription-name
- eraseText
- inputText: Netflix household
- hideKeyboard
- tapOn:
    id: native-subscription-category
- eraseText
- inputText: Streaming extras
- hideKeyboard
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- tapOn:
    id: native-subscription-date
- tapOn: ${E_TODAY}
- assertVisible: ${TODAY}
- takeScreenshot: accepted-sandbox-edit
- scrollUntilVisible:
    element: ${E_SAVE_EDIT}
    direction: DOWN
- tapOn: ${E_SAVE_EDIT}
- scrollUntilVisible:
    element:
      id: native-personal-title
    direction: UP
- extendedWaitUntil:
    visible: ${E_EDIT_SAVED}
    timeout: 30000
- scrollUntilVisible:
    element: Netflix household
    direction: DOWN
- assertVisible: Streaming extras
# Saving returns to the list; open the acknowledged saved row once.
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Netflix household(?:, 129,00[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- scrollUntilVisible:
    element: ${E_PAUSE}
    direction: DOWN
- tapOn: ${E_PAUSE}
- extendedWaitUntil:
    visible: ${E_RESUME}
    timeout: 30000
- tapOn: ${E_RESUME}
- extendedWaitUntil:
    visible: ${E_PAUSE}
    timeout: 30000
- assertNotVisible: ${E_RESUME}
- tapOn:
    id: native-subscription-detail-close
