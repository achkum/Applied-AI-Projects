appId: se.subtrack.app
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${MAESTRO_CREATE_ACCOUNT}
    timeout: 120000
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming Plus
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_OPEN}
    direction: UP
- tapOn: ${MAESTRO_BANK_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_TITLE}
    timeout: 30000
- assertVisible: ${MAESTRO_BANK_DEMO}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_ACTIVE}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_ACTIVE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_COUNT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_COUNT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    timeout: 30000
- assertNotVisible: ${MAESTRO_BANK_LAST_SYNC_NEVER}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_DISCONNECT}
    direction: DOWN
- tapOn: ${MAESTRO_BANK_DISCONNECT}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_REVOKED}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_REVOKED}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_COUNT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_COUNT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    timeout: 30000
- assertNotVisible: ${MAESTRO_BANK_ACTIVE}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_REFRESH}
    direction: DOWN
- tapOn: ${MAESTRO_BANK_REFRESH}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_REVOKED}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_REVOKED}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_COUNT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_COUNT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    timeout: 30000
- assertNotVisible: ${MAESTRO_BANK_ACTIVE}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_CONNECT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_CONNECT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_REVOKED}
    direction: UP
- takeScreenshot: accepted-bank-retained
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: ${MAESTRO_BANK_ACTIVE}
- assertNotVisible: ${MAESTRO_BANK_REVOKED}
- assertNotVisible: ${MAESTRO_BANK_TRANSACTIONS}
- assertNotVisible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
