appId: se.subtrack.app
---
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible: ${MAESTRO_VERIFY_BANKID}
    timeout: 30000
- tapOn: ${MAESTRO_VERIFY_BANKID}
- extendedWaitUntil:
    visible: Native restart proof
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_OPEN}
    direction: UP
- tapOn: ${MAESTRO_MONTH_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
# Wait for the single real saved row or a genuinely empty current local month.
- extendedWaitUntil:
    visible: "${MAESTRO_MONTH_DAY}|${MAESTRO_MONTH_EMPTY}"
    timeout: 30000
# UTC tomorrow can be in the adjacent local month. One ordinary navigation only.
- runFlow:
    when:
      notVisible: ${MAESTRO_MONTH_DAY}
    commands:
      - tapOn: ${MAESTRO_MONTH_NEXT}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_DAY}
    timeout: 30000
- tapOn: ${MAESTRO_MONTH_DAY}
- assertVisible: ${MAESTRO_RENEWAL_DATE}
- assertVisible: Native restart proof
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_REFRESH}
    direction: DOWN
- tapOn: ${MAESTRO_MONTH_REFRESH}
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_DAY}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_DAY}
    timeout: 30000
- tapOn: ${MAESTRO_MONTH_DAY}
- assertVisible: ${MAESTRO_RENEWAL_DATE}
- assertVisible: Native restart proof
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- tapOn: ${MAESTRO_MONTH_DETAIL}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_SAVED_DATE}
    timeout: 30000
- assertVisible: Native restart proof
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- assertVisible: ${MAESTRO_MONTH_MANUAL}
- takeScreenshot: accepted-billing-month-detail
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_CLOSE}
    direction: DOWN
- tapOn: ${MAESTRO_MONTH_CLOSE}
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: Native restart proof
- assertNotVisible: ${MAESTRO_MONTH_SAVED_DATE}
