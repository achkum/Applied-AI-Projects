appId: se.subtrack.app
---
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- tapOn:
    id: native-nav-month
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_NEXT}
    direction: DOWN
# Only an exact previous-month header admits the single adjacent-month action.
- runFlow:
    when:
      visible: ${MAESTRO_MONTH_PREVIOUS}
    commands:
      - tapOn: ${MAESTRO_MONTH_NEXT}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TARGET}
    timeout: 30000
- runFlow:
    file: private-runtime-month-day.yaml
    env:
      MAESTRO_RIBBON_DIRECTION: DOWN
- assertVisible: Example streaming
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_REFRESH}
    direction: DOWN
- tapOn: ${MAESTRO_MONTH_REFRESH}
- runFlow: private-runtime-month-day.yaml
- assertVisible: Example streaming
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- tapOn: ${MAESTRO_MONTH_DETAIL}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_SAVED_DATE}
    timeout: 30000
- assertVisible: Example streaming
- assertVisible: ${MAESTRO_MONTH_AMOUNT}
- assertVisible: ${MAESTRO_MONTH_MANUAL}
- takeScreenshot: accepted-billing-month-detail
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_CLOSE}
    direction: DOWN
- tapOn: ${MAESTRO_MONTH_CLOSE}
- tapOn:
    id: native-nav-manage
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- runFlow: private-runtime-open-profile.yaml
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming
- assertNotVisible: ${MAESTRO_MONTH_SAVED_DATE}
