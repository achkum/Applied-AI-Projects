appId: se.subtrack.app
---
- launchApp
- extendedWaitUntil:
    visible: ${MAESTRO_CREATE_ACCOUNT}
    timeout: 120000
- takeScreenshot: accepted-welcome
- tapOn: ${MAESTRO_CREATE_ACCOUNT}
- extendedWaitUntil:
    visible:
      id: native-identifier-input
    timeout: 30000
- takeScreenshot: accepted-signup
- tapOn:
    id: native-identifier-input
- inputText: native-proof@example.test
- hideKeyboard
- assertVisible:
    text: ${MAESTRO_CONTINUE}
    enabled: true
- tapOn: ${MAESTRO_CONTINUE}
- extendedWaitUntil:
    visible: ${MAESTRO_OTP_LABEL}
    timeout: 30000
