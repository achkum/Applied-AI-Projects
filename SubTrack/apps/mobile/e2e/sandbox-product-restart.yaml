appId: se.subtrack.app.sandbox
---
- extendedWaitUntil:
    visible:
      id: native-profile-language-sv
    timeout: 30000
- tapOn:
    id: native-profile-language-sv
- tapOn:
    id: native-profile-theme-dark
- tapOn:
    id: native-profile-save-preferences
- extendedWaitUntil:
    visible: ${S_PROFILE_SAVED}
    timeout: 30000
- assertVisible:
    id: native-profile-language-sv
    selected: true
- assertVisible:
    id: native-profile-theme-dark
    selected: true
- takeScreenshot: accepted-sandbox-preferences
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: native-welcome-logIn
    timeout: 120000
- assertNotVisible: Aurora Video Plus
- tapOn:
    id: native-welcome-logIn
- extendedWaitUntil:
    visible:
      id: native-nav-household
    timeout: 30000
- tapOn:
    id: native-nav-household
- extendedWaitUntil:
    visible: QA Family
    timeout: 30000
- assertVisible: QA Member
- takeScreenshot: accepted-sandbox-restart-household
- tapOn:
    id: native-nav-manage
- scrollUntilVisible:
    element: Aurora Video Plus
    direction: DOWN
- assertVisible: Streaming extras
- takeScreenshot: accepted-sandbox-restart-subscriptions
- tapOn: Aurora Video Plus
- scrollUntilVisible:
    element: ${S_EDIT}
    direction: DOWN
- tapOn: ${S_EDIT}
- scrollUntilVisible:
    element:
      id: native-subscription-category
    direction: UP
- assertVisible: Streaming extras
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- assertVisible: ${TODAY}
- scrollUntilVisible:
    element: ${S_CANCEL_ADD}
    direction: DOWN
- tapOn: ${S_CANCEL_ADD}
- tapOn:
    id: native-nav-profile
- assertVisible:
    id: native-profile-language-sv
    selected: true
- assertVisible:
    id: native-profile-theme-dark
    selected: true
- scrollUntilVisible:
    element: ${S_LOGOUT}
    direction: DOWN
- tapOn: ${S_LOGOUT}
- extendedWaitUntil:
    visible: ${S_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${S_LOGOUT}
- assertNotVisible: Aurora Video Plus
- assertNotVisible: QA Family
- assertNotVisible:
    id: native-product-navigation
- takeScreenshot: accepted-sandbox-logout
