appId: se.subtrack.app.sandbox
---
- tapOn:
    id: native-nav-profile
- extendedWaitUntil:
    visible:
      id: native-profile-language-sv
    timeout: 30000
- tapOn:
    id: native-profile-language-sv
- extendedWaitUntil:
    visible:
      id: native-profile-language-sv
      selected: true
    timeout: 30000
- assertVisible:
    id: native-profile-language-sv
    selected: true
- tapOn:
    id: native-profile-theme-dark
- extendedWaitUntil:
    visible:
      id: native-profile-theme-dark
      selected: true
    timeout: 30000
- assertVisible:
    id: native-profile-language-sv
    selected: true
- assertVisible:
    id: native-profile-theme-dark
    selected: true
- takeScreenshot: accepted-sandbox-preferences
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: native-nav-household
    timeout: 120000
# The saved installation capability resumes this same isolated owner on startup.
- tapOn:
    id: native-nav-household
- extendedWaitUntil:
    visible: QA Family
    timeout: 30000
- scrollUntilVisible:
    element: QA Member
    direction: DOWN
- assertVisible: QA Member
- scrollUntilVisible:
    element:
      id: native-household-title
    direction: UP
- takeScreenshot: accepted-sandbox-restart-household
- tapOn:
    id: native-nav-manage
- scrollUntilVisible:
    element: Netflix household
    direction: DOWN
- assertVisible: Streaming extras
- takeScreenshot: accepted-sandbox-restart-subscriptions
- tapOn:
    id: native-subscription-row-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}
    text: Netflix household(?:, 129,00[ \u00a0\u202f]+SEK · [^\r\n]{1,128})?
- scrollUntilVisible:
    element: ${S_EDIT}
    direction: DOWN
- tapOn: ${S_EDIT}
- scrollUntilVisible:
    element:
      id: native-subscription-category
    direction: UP
- assertVisible: Streaming extras
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- assertVisible: ${TODAY}
- scrollUntilVisible:
    element: ${S_CANCEL_ADD}
    direction: DOWN
- tapOn: ${S_CANCEL_ADD}
- tapOn:
    id: native-nav-profile
- assertVisible:
    id: native-profile-language-sv
    selected: true
- assertVisible:
    id: native-profile-theme-dark
    selected: true
- scrollUntilVisible:
    element: ${S_LOGOUT}
    direction: DOWN
- tapOn: ${S_LOGOUT}
- extendedWaitUntil:
    visible: ${S_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${S_LOGOUT}
- assertNotVisible: Netflix household
- assertNotVisible: QA Family
- assertNotVisible:
    id: native-product-navigation
- takeScreenshot: accepted-sandbox-logout
