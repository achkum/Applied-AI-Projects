appId: se.subtrack.app
---
- scrollUntilVisible:
    element: ${MAESTRO_BANK_SYNC}
    direction: DOWN
- tapOn: ${MAESTRO_BANK_SYNC}
- scrollUntilVisible:
    element: ${MAESTRO_BANK_ACTIVE}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_ACTIVE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_COUNT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_COUNT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    timeout: 30000
- assertNotVisible: ${MAESTRO_BANK_LAST_SYNC_NEVER}
# Pinned Maestro swipe.from selector: real read-only pull-to-refresh.
- scrollUntilVisible:
    element:
      id: native-bank-title
    direction: UP
- swipe:
    from:
      id: native-bank-scroll
    direction: DOWN
    duration: 700
- scrollUntilVisible:
    element: ${MAESTRO_BANK_ACTIVE}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_ACTIVE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_COUNT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_COUNT}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
    timeout: 30000
- assertNotVisible: ${MAESTRO_BANK_LAST_SYNC_NEVER}
- takeScreenshot: accepted-bank-active
# Leave the contextual bank page; logout lives on Profile.
- scrollUntilVisible:
    element:
      id: native-bank-title
    direction: UP
- tapOn: ${MAESTRO_BANK_MANAGE}
- extendedWaitUntil:
    visible:
      id: native-nav-profile
    timeout: 30000
- tapOn:
    id: native-nav-profile
- extendedWaitUntil:
    visible:
      id: native-personal-title
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: ${MAESTRO_BANK_ACTIVE}
- assertNotVisible: ${MAESTRO_BANK_REVOKED}
- assertNotVisible: ${MAESTRO_BANK_TRANSACTIONS}
- assertNotVisible: ${MAESTRO_BANK_LAST_SYNC_PRESENT}
