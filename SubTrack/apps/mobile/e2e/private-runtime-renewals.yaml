appId: se.subtrack.app
---
# Previous parent flow ends logged out. Verify fresh authority, then open agenda.
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element: ${MAESTRO_RENEWALS_OPEN}
    direction: UP
- tapOn: ${MAESTRO_RENEWALS_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_RENEWALS_TITLE}
    timeout: 30000
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- assertVisible: ${MAESTRO_RENEWAL_DATE}
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- scrollUntilVisible:
    element: ${MAESTRO_RENEWALS_REFRESH}
    direction: DOWN
- tapOn: ${MAESTRO_RENEWALS_REFRESH}
- extendedWaitUntil:
    visible: Example streaming
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming
    direction: DOWN
    centerElement: true
- assertVisible: ${MAESTRO_RENEWAL_DATE}
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- takeScreenshot: accepted-renewals
- tapOn:
    id: native-nav-manage
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming
