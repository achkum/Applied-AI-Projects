appId: se.subtrack.app
---
# API has restarted; startup still requires fresh verified authority.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${MAESTRO_CREATE_ACCOUNT}
    timeout: 120000
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- assertNotVisible: Example streaming Plus
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming Plus
    timeout: 30000
- tapOn: Example streaming Plus
- assertVisible: ${MAESTRO_EDIT}
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- assertNotVisible: ${MAESTRO_PAUSE}
- assertNotVisible: ${MAESTRO_RESUME}
- assertNotVisible: ${MAESTRO_MARK_CANCELLED}
- assertNotVisible: ${MAESTRO_ARCHIVE}
- takeScreenshot: accepted-edited-api-restart
- tapOn:
    id: native-subscription-detail-close
- runFlow: private-runtime-open-profile.yaml
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming Plus
