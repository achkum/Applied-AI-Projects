appId: se.subtrack.app.sandbox
---
- tapOn:
    id: native-nav-manage
- extendedWaitUntil:
    visible: ${E_BANK_OPEN}
    timeout: 30000
- tapOn: ${E_BANK_OPEN}
- extendedWaitUntil:
    visible:
      id: native-bank-connect
    timeout: 30000
- tapOn:
    id: native-bank-connect
- extendedWaitUntil:
    visible: ${E_BANK_ACTIVE}
    timeout: 60000
- assertVisible:
    id: native-bank-sync-0
- takeScreenshot: accepted-sandbox-bank
- scrollUntilVisible:
    element:
      id: native-bank-review
    direction: DOWN
- tapOn:
    id: native-bank-review
- extendedWaitUntil:
    visible:
      id: native-detection-title
    timeout: 30000
- scrollUntilVisible:
    element:
      id: native-detection-confirm-aurora-video
    direction: DOWN
- takeScreenshot: accepted-sandbox-detections
- tapOn:
    id: native-detection-confirm-aurora-video
- scrollUntilVisible:
    element:
      id: native-detection-title
    direction: UP
- extendedWaitUntil:
    visible: ${E_REVIEWED}
    timeout: 30000
- scrollUntilVisible:
    element:
      id: native-detection-confirm-cinema-plus
    direction: DOWN
- tapOn:
    id: native-detection-confirm-cinema-plus
- scrollUntilVisible:
    element:
      id: native-detection-title
    direction: UP
- extendedWaitUntil:
    visible: ${E_REVIEWED}
    timeout: 30000
- scrollUntilVisible:
    element:
      id: native-detection-reject-move-club
    direction: DOWN
- tapOn:
    id: native-detection-reject-move-club
- scrollUntilVisible:
    element:
      id: native-detection-title
    direction: UP
- extendedWaitUntil:
    visible:
      id: native-detection-undo
    timeout: 5000
- tapOn:
    id: native-detection-undo
- extendedWaitUntil:
    visible: ${E_UNDONE}
    timeout: 30000
- scrollUntilVisible:
    element:
      id: native-detection-confirm-move-club
    direction: DOWN
- assertVisible:
    id: native-detection-confirm-move-club
- takeScreenshot: accepted-sandbox-reviewed
- scrollUntilVisible:
    element: ${E_MANAGE}
    direction: DOWN
- tapOn: ${E_MANAGE}
- extendedWaitUntil:
    visible:
      id: native-nav-manage
    timeout: 30000
