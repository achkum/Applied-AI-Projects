appId: se.subtrack.app
---
- tapOn:
    id: native-registration-otp
- inputText: ${MAESTRO_PRIVATE_OTP}
- hideKeyboard
- tapOn: ${MAESTRO_VERIFY_OTP}
- extendedWaitUntil:
    visible: ${MAESTRO_VERIFY_BANKID}
    timeout: 30000
- tapOn: ${MAESTRO_VERIFY_BANKID}
- extendedWaitUntil:
    visible: ${MAESTRO_PROFILE_NAME}
    timeout: 30000
- assertVisible:
    id: native-personal-title
    text: ${MAESTRO_PROFILE_TITLE}
- tapOn:
    id: native-profile-name
- inputText: Synthetic Native Proof
- hideKeyboard
- tapOn: ${MAESTRO_ENGLISH}
- scrollUntilVisible:
    element: ${MAESTRO_SAVE_PROFILE}
    direction: DOWN
- tapOn: ${MAESTRO_SAVE_PROFILE}
- extendedWaitUntil:
    visible: ${MAESTRO_JUST_ME}
    timeout: 30000
- tapOn: ${MAESTRO_JUST_ME}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
- tapOn: ${MAESTRO_MANAGE}
- scrollUntilVisible:
    element:
      id: native-personal-title
    direction: UP
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_ADD}
    direction: DOWN
- extendedWaitUntil:
    visible: ${MAESTRO_ADD}
    timeout: 30000
- tapOn: ${MAESTRO_ADD}
- scrollUntilVisible:
    element:
      id: native-subscription-name
    direction: DOWN
- tapOn:
    id: native-subscription-name
- inputText: Native restart proof
- hideKeyboard
- scrollUntilVisible:
    element: ${MAESTRO_CATEGORY}
    direction: DOWN
- tapOn: ${MAESTRO_CATEGORY}
- scrollUntilVisible:
    element:
      id: native-subscription-amount
    direction: DOWN
- tapOn:
    id: native-subscription-amount
- inputText: '129.90'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: native-subscription-date
    direction: DOWN
- tapOn:
    id: native-subscription-date
- inputText: ${MAESTRO_RENEWAL_DATE}
- hideKeyboard
- scrollUntilVisible:
    element: ${MAESTRO_SAVE_SUBSCRIPTION}
    direction: DOWN
- assertVisible:
    text: ${MAESTRO_SAVE_SUBSCRIPTION}
    enabled: true
- tapOn: ${MAESTRO_SAVE_SUBSCRIPTION}
- scrollUntilVisible:
    element:
      id: native-personal-title
    direction: UP
- assertVisible:
    id: native-personal-title
    text: ${MAESTRO_PERSONAL_TITLE}
- extendedWaitUntil:
    visible: ${MAESTRO_SAVED}
    timeout: 30000
- scrollUntilVisible:
    element: Native restart proof
    direction: DOWN
- assertVisible: Native restart proof
- assertVisible: ${MAESTRO_EXPECTED_AMOUNT}
- takeScreenshot: accepted-add
