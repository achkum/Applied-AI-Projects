appId: se.subtrack.app
---
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible: ${MAESTRO_VERIFY_BANKID}
    timeout: 30000
- tapOn: ${MAESTRO_VERIFY_BANKID}
- extendedWaitUntil:
    visible: Native edited restart proof
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_OPEN}
    direction: UP
- tapOn: ${MAESTRO_MONTH_OPEN}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
# Only an exact previous-month header admits the single adjacent-month action.
- runFlow:
    when:
      visible: ${MAESTRO_MONTH_PREVIOUS}
    commands:
      - tapOn: ${MAESTRO_MONTH_NEXT}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TARGET}
    timeout: 30000
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_EMPTY}
    timeout: 30000
- runFlow: private-runtime-month-day.yaml
- assertVisible: ${MAESTRO_MONTH_DAY_EMPTY}
- assertNotVisible: Native edited restart proof
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_REFRESH}
    direction: DOWN
- tapOn: ${MAESTRO_MONTH_REFRESH}
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_EMPTY}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_EMPTY}
    timeout: 30000
- runFlow: private-runtime-month-day.yaml
- assertVisible: ${MAESTRO_MONTH_DAY_EMPTY}
- assertNotVisible: Native edited restart proof
- takeScreenshot: accepted-billing-month-empty
- tapOn: ${MAESTRO_MANAGE}
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: Native edited restart proof
- assertNotVisible: ${MAESTRO_MONTH_SAVED_DATE}
