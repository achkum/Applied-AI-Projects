appId: se.subtrack.app
---
- openLink: subtrack:///personal
- extendedWaitUntil:
    visible:
      id: native-personal-login
    timeout: 30000
- tapOn:
    id: native-personal-login
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: Example streaming Plus
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Example streaming Plus
    timeout: 30000
- tapOn:
    id: native-nav-month
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TITLE}
    timeout: 30000
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_NEXT}
    direction: DOWN
# Only an exact previous-month header admits the single adjacent-month action.
- runFlow:
    when:
      visible: ${MAESTRO_MONTH_PREVIOUS}
    commands:
      - tapOn: ${MAESTRO_MONTH_NEXT}
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_TARGET}
    timeout: 30000
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_EMPTY}
    timeout: 30000
- runFlow: private-runtime-month-day.yaml
- assertNotVisible: ${MAESTRO_MONTH_DAY_EMPTY}
- assertNotVisible: Example streaming Plus
# Real Home pull-to-refresh; no mutation or replacement projection.
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_TITLE}
    direction: UP
    centerElement: true
- swipe:
    from:
      id: native-month-scroll
    direction: DOWN
    duration: 700
- scrollUntilVisible:
    element: ${MAESTRO_MONTH_EMPTY}
    direction: UP
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_EMPTY}
    timeout: 30000
- runFlow: private-runtime-month-day.yaml
- assertNotVisible: ${MAESTRO_MONTH_DAY_EMPTY}
- assertNotVisible: Example streaming Plus
- takeScreenshot: accepted-billing-month-empty
- tapOn:
    id: native-nav-manage
- extendedWaitUntil:
    visible:
      id: native-personal-title
      text: ${MAESTRO_PERSONAL_TITLE}
    timeout: 30000
- runFlow: private-runtime-open-profile.yaml
- scrollUntilVisible:
    element: ${MAESTRO_LOGOUT}
    direction: DOWN
- tapOn: ${MAESTRO_LOGOUT}
- extendedWaitUntil:
    visible: ${MAESTRO_LOGOUT_CONFIRMED}
    timeout: 30000
- assertNotVisible: ${MAESTRO_LOGOUT}
- assertNotVisible: Example streaming Plus
- assertNotVisible: ${MAESTRO_MONTH_SAVED_DATE}
