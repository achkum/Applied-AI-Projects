appId: se.subtrack.app
---
- repeat:
    times: 31
    while:
      notVisible: ${MAESTRO_MONTH_DAY}
    commands:
      - swipe:
          from:
            id: native-month-ribbon
          direction: LEFT
          duration: 400
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${MAESTRO_MONTH_DAY}
    timeout: 30000
- tapOn: ${MAESTRO_MONTH_DAY}
- assertVisible:
    text: ${MAESTRO_MONTH_DAY}
    selected: true
