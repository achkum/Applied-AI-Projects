desktop_handoff:
  updated_date: '2026-10-10'
  branch: st/ST-206-deployment-images
  base_main: 09bfbc9c8a677495f392040615fbdcbc3cda491a
  disposition: WIP handoff for desktop continuation. Do not merge or deploy this branch until outstanding review,
    QA and release gates pass.
  user_instruction: Push all current work and detailed analysis into Git so development can continue from the
    desktop.
  cloud_findings:
  - SSH root@198.44.116.159 works from the founder Windows PowerShell session and reaches password authentication
    on default port 22.
  - The same target refuses the cloud TCP connection before authentication, both inside and outside the sandbox.
    A CONNECT attempt through the configured cloud proxy returns HTTP 403. This establishes cloud connection
    failure, not a VPS SSH outage or bad password.
  - No VPS login, service inspection, database inventory, migration, deployment or firewall change was performed.
    Do not ask for or commit passwords/private keys.
  - Docker uses vfs storage in this cloud environment. Repeated dependency layers exhausted its 32 GB disk. Only
    task-created, unshared build cache was removed; older/shared images, user files and existing volumes were
    retained.
  - Container downloads need the cloud proxy and trusted CA. Proxy host resolution in BuildKit needed an explicit
    host mapping. These are cloud build inputs, not desktop requirements. TLS verification remained enabled.
  - Corepack in the selected Node image expects a pnpm.cjs entry point that pnpm 12.6.0 no longer supplies. Dockerfiles
    now install the exact pinned native pnpm package through npm, keeping frozen-lockfile installs and pnpm supply-chain
    checks.
  implemented:
    ST-206: API and web multi-stage Dockerfiles, nonroot runtimes, scoped installs, Docker ignore rules, generated
      Prisma client handoff, OpenSSL-compatible Debian API runtime, Next standalone output and monorepo tracing
      root. Builds consolidated to avoid vfs layer amplification. No automatic migrations or auth activation.
    ST-050b: Localized web registration route and welcome action preserving existing styling; existing IdentifierEntry
      composes nonce bootstrap, enrollment OTP start/verify and nonce restart. Fixed same-origin /api/v2/auth
      paths, in-memory secrets, abort handling and generated request types. Enrollment verification ends at BankID
      continuation; it does not log the user in.
    ST-051d: Mobile /welcome and /register routes using accepted WelcomeActions and IdentifierEntry. Demo navigation
      follows locale. Identifier format validation is local; continuation and login explicitly remain unavailable.
      No invented mobile OTP/session API or credentials.
    shared_catalogs: Swedish and English registration copy added. Separate identifierValid text prevents mobile
      local validation from implying server verification.
    ST-081a: Previously accepted main receipt carried into Git and task/backlog marked DONE for its private lifecycle
      core only. Parent ST-081 remains incomplete.
  checks:
    api_docker_build: PASS; image sha256:c17a035178a4b888a46a5c4b4a5d03ed876d4a5f8d0a1814d2e78fcecda5873c (local
      image; not pushed to a registry)
    api_container_smoke: PASS; isolated fresh PostgreSQL connection, GET /healthz returns 200 with status ok,
      UID 1000, no host ports. Test containers/network removed. No schema migrations were applied.
    web_typecheck: PASS after final materialization
    mobile_typecheck: PASS
    web_registration_tests: PASS; 4 tests covering OTP validation/rotation, restart, pending submission, unmount/late
      bootstrap.
    mobile_registration_tests: PASS; 5 tests with NODE_PATH pointing to apps/mobile/node_modules. First plain
      invocation failed because shared i18n Babel transformation could not resolve @babel/runtime. The environment
      override fixed resolution; no test was skipped.
    mobile_lint: PASS
    web_lint: PASS
    i18n_parity: PASS
    web_docker_build_and_http: NOT RUN after latest UI materialization; run on desktop
    full_ci: NOT RUN on this WIP branch
    native_android_ios: DEFERRED by founder; not passed
    independent_review: Initial container review requested generated Prisma client transfer. Implementation corrected,
      but final source/runtime review remains pending. Registration candidates also require independent review
      and accessibility/visual QA.
    secret_scan: PASS; staged Gitleaks scan found no secrets
