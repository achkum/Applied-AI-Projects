    M0: Foundation implementation and review package exist; remaining environment/full-stack exit evidence must
      be verified on desktop. No fresh complete M0 audit was performed for this handoff.
    D1: Keep approved existing design. Native assets/validation and remaining design exit evidence are incomplete
      or deferred.
    M1: Onboarding/auth cores and new route candidates exist; complete signup/login, verified BankID, profile/household
      flows and trusted HTTP authentication remain pending.
    M2: Detection/subscription cores exist; banking UI/provider prerequisites, persistence/security integration
      and E2E remain pending.
    M3: Detection cores need remaining runtime/API/UI integration and acceptance evidence.
    M4: Exact Money foundations exist; remaining split/settlement APIs and UI need implementation/verification.
    M5: ML/private insight helpers exist; production forecasting, cohorts, registry/insight/scraper integrations
