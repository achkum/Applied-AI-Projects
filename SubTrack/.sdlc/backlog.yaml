    git fetch origin
    git switch --track origin/st/ST-206-deployment-images
    cd SubTrack
    npm install --global pnpm@12.6.0
    pnpm install --frozen-lockfile
    pnpm --filter @subtrack/web typecheck
    pnpm --filter @subtrack/mobile typecheck
    pnpm --filter @subtrack/web lint
    pnpm --filter @subtrack/mobile lint
    pnpm --filter @subtrack/web test
    $env:NODE_PATH = Join-Path (Get-Location).Path 'apps/mobile/node_modules'
    pnpm --filter @subtrack/mobile test
    node packages/i18n/scripts/check-parity.mjs
    docker build -f apps/api/Dockerfile -t subtrack-api:desktop .
    docker build -f apps/web/Dockerfile -t subtrack-web:desktop .
    ssh root@198.44.116.159
