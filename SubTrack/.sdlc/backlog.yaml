    changes, then create/merge reviewed task PRs. Do not start by applying migrations.
  - SSH from the desktop for read-only VPS service/database inventory. Secure credentials on the VPS or in supported
    environment settings, never in Git/chat.
  - Resolve active caller-ID authorization and migration ownership/RLS before hosting the app. Use existing ops
    runbooks for staging secret layout/basic-auth; do not expose databases, Redis, ML or worker ports publicly.
