  - 'ST-050b: response decoding and streamed 32 KiB body cap verified in the desktop continuation;
    see .sdlc/evidence/ST-050b/desktop-continuation.md. Runtime routing and full onboarding remain pending.'
  - 'ST-050b: verify endpoint routing on the desktop/staging reverse proxy. Accepted v2 OTP routes are development
    opt-ins; production mode deliberately rejects their activation. Do not silently enable them or claim a complete
    production signup flow.'
  - 'ST-050b: desktop tests cover malformed responses, server/network failures, back-navigation races,
    synchronous submissions and bilingual accessibility. Built-route visual checks use mocked OTP;
    backend acceptance and full UF coverage remain pending.'
  - 'ST-051d: identifier continuation currently displays an explicit unavailable state. Implement approved mobile
    OTP/BankID contract integration later; local validation is not completed onboarding.'
  - 'ST-206: build latest web image, request /sv and /en plus a referenced static asset, confirm nonroot startup
    and traced workspace dependencies. Verify both images after further auth changes.'
  - 'SEC-FU1: accepted JWT validation and live owner-resolution cores still need trusted HTTP principal attachment,
    a scoped storage reader and actual route integration. Active Privacy/DataRights legacy caller-ID trust is
    a deployment-blocking security finding.'
  - 'BUG-008: incompatible duplicate 0002 migrations remain unresolved. Inventory every existing relevant database
    and its _prisma_migrations read-only, then approve the repair plan before modifying or applying migrations.
    Fresh empty cloud test Postgres is not evidence that external databases are absent.'
  - 'ST-081: private lifecycle decisions are implemented, but authenticated current-owner/current-status/version,
    atomic persistence/replay, RLS, retention and feedback integration remain incomplete.'
  - 'BankID sandbox: obtain/verify approved test credentials and current provider documentation; existing internal
    simulator proof producer is not complete signup or a real sandbox integration.'
  - Tink/banking integration, full onboarding/profile/household flows and end-to-end tests remain incomplete;
    do not invent unavailable endpoints or provider delivery.
  - Worker package scripts are scaffolding with no implemented worker runtime; containers alone do not complete
    background jobs.
  - Persona clustering uses synthetic data and recorded silhouette 0.134140945; accepted private artifacts do
    not establish representative cohorts or a production product registry.
  - Do not merge until independent reviews and required CI gates pass. Public release, public VPS exposure and
    real provider delivery remain separate approval/security gates.
