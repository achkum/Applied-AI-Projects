name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SubTrack/package-lock.json
      - run: npm --prefix SubTrack ci
      - run: npm --prefix SubTrack run check
      - run: npm --prefix SubTrack/packages/household-core test
      - name: Secret-pattern scan
        run: '! grep -RInE "(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})" --exclude-dir=.git --exclude=package-lock.json .'
