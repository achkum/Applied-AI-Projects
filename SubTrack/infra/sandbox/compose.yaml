name: subtrack-sandbox
# Default starts nothing. Preparation remains disabled; live/loader are explicit.
services:
  database:
    profiles: [sandbox-prepared, sandbox-live, sandbox-bootstrap]
    image: ${SANDBOX_POSTGRES_IMAGE:?verified postgres16 digest required}
    user: "999:999"
    environment:
      POSTGRES_DB: subtrack_sandbox
      POSTGRES_USER: subtrack_sandbox_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB]
    secrets: [database_bootstrap]
    volumes: [database-data:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m", "/var/run/postgresql:size=4m,uid=999,gid=999"]
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, subtrack_sandbox_bootstrap, -d, subtrack_sandbox]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    logging: &bounded_logs
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  api: &prepared_api
    profiles: [sandbox-prepared]
    image: ${SANDBOX_API_IMAGE:?reviewed sandbox API digest required}
    user: "1000:1000"
    environment: &sandbox_api_environment
      NODE_ENV: production
      SUBTRACK_RUNTIME: sandbox
      SANDBOX_STARTUP_ENABLED: "false"
      SANDBOX_PUBLICATION_ENABLED: "false"
      SANDBOX_DATABASE_HOST: database
      SANDBOX_DATABASE_NAME: subtrack_sandbox
      SANDBOX_DATABASE_ROLE: subtrack_sandbox_runtime
      SANDBOX_POOL_MAX: "4"
      SANDBOX_DATABASE_CREDENTIAL_FILE: /run/secrets/database_runtime
      SANDBOX_AUTH_MATERIAL_FILE: /run/secrets/api_auth_material
      PORT: "4000"
    secrets: [database_runtime, api_auth_material]
    networks: [database, ingress]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,uid=1000,gid=1000"]
    restart: "no"
    stop_grace_period: 20s
    logging: *bounded_logs
  api-live:
    <<: *prepared_api
    profiles: [sandbox-live]
    environment:
      <<: *sandbox_api_environment
      SANDBOX_STARTUP_ENABLED: "true"
      SANDBOX_PUBLICATION_ENABLED: "true"
    depends_on:
      database: {condition: service_healthy}
  bootstrap:
    <<: *prepared_api
    profiles: [sandbox-bootstrap]
    entrypoint: [node, /opt/subtrack/bootstrap.cjs, install]
    command: []
    environment:
      <<: *sandbox_api_environment
      SANDBOX_STARTUP_ENABLED: "true"
      SANDBOX_PUBLICATION_ENABLED: "true"
    secrets: [database_runtime, api_auth_material, database_bootstrap_loader]
    volumes: ["../../tools/sandbox/bootstrap.cjs:/opt/subtrack/bootstrap.cjs:ro"]
    networks: [database]
    depends_on:
      database: {condition: service_healthy}
  gateway: &prepared_gateway
    profiles: [sandbox-prepared]
    image: ${SANDBOX_CADDY_IMAGE:?verified caddy2.11.7 digest required}
    user: "1000:1000"
    environment:
      SANDBOX_GATEWAY_PUBLICATION: "false"
    entrypoint: [caddy]
    command: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificate-data:/data
      - gateway-config:/config
    networks: [ingress]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,uid=1000,gid=1000"]
    restart: "no"
    stop_grace_period: 10s
    logging: *bounded_logs
  gateway-live:
    <<: *prepared_gateway
    profiles: [sandbox-live]
    entrypoint: [sh, /opt/subtrack/gateway-entrypoint.sh]
    command: []
    environment:
      SANDBOX_GATEWAY_PUBLICATION: "true"
    secrets: [gateway_key]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway-entrypoint.sh:/opt/subtrack/gateway-entrypoint.sh:ro
      - certificate-data:/data
      - gateway-config:/config
    networks: [ingress, edge]
    ports: ["80:8080", "443:8443"]
    depends_on: [api-live]
networks:
  database: {internal: true}
  ingress: {internal: true}
  edge: {}
volumes:
  database-data: {}
  certificate-data: {}
  gateway-config: {}
secrets:
  database_bootstrap: {file: /home/openclaw/subtrack-sandbox/secrets/database-bootstrap}
  database_runtime: {file: /home/openclaw/subtrack-sandbox/secrets/database-runtime}
  api_auth_material: {file: /home/openclaw/subtrack-sandbox/secrets/api-auth-material}
  database_bootstrap_loader: {file: /home/openclaw/subtrack-sandbox/secrets/database-bootstrap-loader}
  gateway_key: {file: /home/openclaw/subtrack-sandbox/secrets/gateway-key}
