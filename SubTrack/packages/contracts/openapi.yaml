openapi: 3.1.0
info:
  title: SubTrack API
  version: 1.0.0
  description: Contract metadata and approved operational endpoints.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        '200':
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        '200':
          description: API is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/bankid/verify:
    post:
      operationId: verifyBankId
      summary: Verify a BankID completion token
      description: >
        Verifies a BankID (or simulator) token and registers or logs in the
        resulting identity. In development the token is one of the fixed demo
        identities: alice, bob, carol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyBankIdBody'
      responses:
        '200':
          description: Identity verified — registered or logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyBankIdResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a one-time password
      description: >
        Sends a six-digit OTP to the supplied email or E.164 phone number via
        the configured delivery adapter (DevInbox in development).
        Rate-limited: 30-second cooldown between sends, maximum 6 total sends
        per identifier per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpBody'
      responses:
        '202':
          description: OTP accepted for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify a one-time password
      description: >
        Verifies a previously issued OTP. The code is consumed on success and
        cannot be reused. Locks the identifier for 15 minutes after 5 wrong
        attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpBody'
      responses:
        '200':
          description: OTP verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/session:
    post:
      operationId: createSession
      summary: Create a session after successful OTP or BankID auth
      description: >
        Issues an EdDSA JWT access token (15 min TTL) and an opaque refresh
        credential. Only the SHA-256 hash of the refresh token is stored.
        M1 placeholder: caller identity provided via X-Caller-Id header until
        JWT middleware is wired (ST-044).
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
      responses:
        '201':
          description: Session created — returns token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >
        Presents the current opaque refresh token, receives a new token pair.
        The old token is immediately revoked.
        Reuse of a revoked token triggers family-wide revocation (all rotations
        of that credential are invalidated, forcing reauthentication).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBody'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/devices:
    get:
      operationId: listDevices
      summary: List active sessions for the caller
      description: >
        Returns all non-revoked sessions for the authenticated user.
        Only own devices are returned.
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke a specific session
      description: >
        Revokes one device without affecting other active sessions.
        Returns 204 whether or not the session was already revoked (idempotent).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/version:
    get:
      operationId: getVersion
      summary: API version
      responses:
        '200':
          description: API semantic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: Current API semantic version.
    VerifyBankIdBody:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: >
            BankID completion token (RP API) or simulator demo ID
            (alice | bob | carol) in development.

    VerifyBankIdResponse:
      type: object
      additionalProperties: false
      required: [action, identityId]
      properties:
        action:
          type: string
          enum: [registered, logged_in]
        identityId:
          type: string
          format: uuid

    RequestOtpBody:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          description: Email address or E.164 phone number.
          examples:
            - user@example.com
            - '+46701234567'

    VerifyOtpBody:
      type: object
      additionalProperties: false
      required: [identifier, code]
      properties:
        identifier:
          type: string
        code:
          type: string
          pattern: '^\d{6}$'
          description: Six-digit OTP sent to the identifier.

    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    VerifiedResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean
          const: true

    CreateSessionBody:
      type: object
      additionalProperties: false
      required: [identityId, deviceName]
      properties:
        identityId:
          type: string
          format: uuid
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-readable device label, e.g. "Chrome on macOS".

    RefreshBody:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 64-character hex opaque refresh credential.

    SessionTokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Short-lived EdDSA JWT (15-minute TTL).
        refreshToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Opaque 64-character hex refresh credential.

    DeviceInfo:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [type, title, status]
  responses:
    Problem:
      description: An error response following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
