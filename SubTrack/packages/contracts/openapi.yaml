openapi: 3.1.0
info:
  title: SubTrack API
  version: 1.0.0
  description: Contract metadata and approved operational endpoints.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        '200':
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        '200':
          description: API is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      summary: API version
      responses:
        '200':
          description: API semantic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: Current API semantic version.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [type, title, status]
  responses:
    Problem:
      description: An error response following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
