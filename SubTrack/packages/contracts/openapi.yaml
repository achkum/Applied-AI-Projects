openapi: 3.1.0
info:
  title: SubTrack API
  version: 1.0.0
  description: Contract metadata and approved operational endpoints.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        '200':
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        '200':
          description: API is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/privacy/settings:
    get:
      operationId: getPrivacySettings
      summary: List open_book consent settings for all households (AC1)
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of consent settings, one entry per household.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentSetting'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/privacy/open-book:
    patch:
      operationId: setOpenBook
      summary: Toggle open_book for a household scope (AC1, AC4)
      description: >
        Sets the caller's open_book consent for the specified household.
        Default is OFF. Only the caller themselves can change their own setting —
        admins cannot alter other members' privacy (AC4).
        Updates take effect within 5 seconds (cache TTL, AC1).
        Writes a hash-chained audit event.
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOpenBookBody'
      responses:
        '200':
          description: Updated consent setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSetting'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/privacy/preview-as/{householdId}:
    get:
      operationId: previewAsHousehold
      summary: Preview subscriptions as a household member (AC3)
      description: >
        Evaluates subscription visibility using the exact policy from ST-048.
        Returns safe subscription summaries — no raw transactions, balances,
        account numbers, or PII. Always-private subscriptions are hidden from
        non-owners even when the owner has open_book=ON (AC2).
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible subscription summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/session:
    post:
      operationId: createSession
      summary: Create a session after successful OTP or BankID auth
      description: >
        Issues an EdDSA JWT access token (15 min TTL) and an opaque refresh
        credential. Only the SHA-256 hash of the refresh token is stored.
        M1 placeholder: caller identity provided via X-Caller-Id header until
        JWT middleware is wired (ST-044).
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
      responses:
        '201':
          description: Session created — returns token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >
        Presents the current opaque refresh token, receives a new token pair.
        The old token is immediately revoked.
        Reuse of a revoked token triggers family-wide revocation (all rotations
        of that credential are invalidated, forcing reauthentication).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBody'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPair'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/devices:
    get:
      operationId: listDevices
      summary: List active sessions for the caller
      description: >
        Returns all non-revoked sessions for the authenticated user.
        Only own devices are returned.
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke a specific session
      description: >
        Revokes one device without affecting other active sessions.
        Returns 204 whether or not the session was already revoked (idempotent).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/version:
    get:
      operationId: getVersion
      summary: API version
      responses:
        '200':
          description: API semantic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: Current API semantic version.
    SetOpenBookBody:
      type: object
      additionalProperties: false
      required: [householdId, openBook]
      properties:
        householdId:
          type: string
          format: uuid
        openBook:
          type: boolean
          description: true = share subscriptions with household peers; false (default) = private.

    ConsentSetting:
      type: object
      additionalProperties: false
      required: [householdId, openBook, updatedAt]
      properties:
        householdId:
          type: string
          format: uuid
        openBook:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [id, categoryCode, cadence, status]
      properties:
        id:
          type: string
          format: uuid
        customName:
          type: string
          nullable: true
        categoryCode:
          type: string
        cadence:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM]
        status:
          type: string
          enum: [DETECTED, TRIAL, ACTIVE, PAUSED, CANCELLED, ARCHIVED, REJECTED]
        alwaysPrivate:
          type: boolean
          description: Only present for the subscription owner — never exposed to other members.

    CreateSessionBody:
      type: object
      additionalProperties: false
      required: [identityId, deviceName]
      properties:
        identityId:
          type: string
          format: uuid
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-readable device label, e.g. "Chrome on macOS".

    RefreshBody:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 64-character hex opaque refresh credential.

    SessionTokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Short-lived EdDSA JWT (15-minute TTL).
        refreshToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Opaque 64-character hex refresh credential.

    DeviceInfo:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [type, title, status]
  responses:
    Problem:
      description: An error response following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
