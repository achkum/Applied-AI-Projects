openapi: 3.1.0
info:
  title: SubTrack API
  version: 1.1.1
  description: Contract metadata and approved operational endpoints.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      responses:
        '200':
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness check
      responses:
        '200':
          description: API is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/privacy/settings:
    get:
      operationId: getPrivacySettings
      x-runtime-availability: unavailable-default
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
      summary: List open_book consent settings for all households (AC1)
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of consent settings, one entry per household.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentSetting'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/privacy/open-book:
    patch:
      operationId: setOpenBook
      x-runtime-availability: unavailable-default
      summary: Toggle open_book for a household scope (AC1, AC4)
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
        Sets the caller's open_book consent for the specified household.
        Default is OFF. Only the caller themselves can change their own setting —
        admins cannot alter other members' privacy (AC4).
        Updates take effect within 5 seconds (cache TTL, AC1).
        Writes a hash-chained audit event.
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOpenBookBody'
      responses:
        '200':
          description: Updated consent setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSetting'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/privacy/preview-as/{householdId}:
    get:
      operationId: previewAsHousehold
      x-runtime-availability: unavailable-default
      summary: Preview subscriptions as a household member (AC3)
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
        Evaluates subscription visibility using the exact policy from ST-048.
        Returns safe subscription summaries — no raw transactions, balances,
        account numbers, or PII. Always-private subscriptions are hidden from
        non-owners even when the owner has open_book=ON (AC2).
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible subscription summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/data-rights/export:
    post:
      operationId: requestDataExport
      x-runtime-availability: unavailable-default
      summary: Request a full personal data export (AC1)
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
        Assembles a ZIP archive containing export.json (all personal data) and
        subscriptions.csv. Returns a single-use download token valid for 24 hours.
        Scoped only to the caller's own data.
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Export job accepted; archive is ready at the returned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/data-rights/export/{token}:
    get:
      operationId: downloadDataExport
      x-runtime-availability: unavailable-default
      summary: Download a previously requested data export (AC1, AC3)
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
        Returns the ZIP file for a valid, non-expired export token.
        Returns 404 for unknown or expired tokens — the response does not
        distinguish between the two cases (AC3).
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ZIP archive download.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/data-rights/account:
    delete:
      operationId: deleteAccount
      x-runtime-availability: unavailable-default
      summary: Permanently delete account and personal data (AC2)
      description: >
        Unavailable in the default and configured v2 nonce/OTP application graphs (ADR-0018).
        Retained contract; authenticated principal, data scope and lifecycle review are required before activation.
        Requires BankID or OTP re-authentication via `reAuthToken`.
        If the caller is the sole admin of a household with remaining members,
        returns 400 requiring role transfer first.
        Nullifies PII fields (email, phone, externalId) and sets deletedAt.
        Audit log entries are kept with pseudonymous identifiers only (AC2).
      parameters:
        - in: header
          name: X-Caller-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountBody'
      responses:
        '204':
          description: Account and personal data deleted.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/version:
    get:
      operationId: getVersion
      summary: API version
      responses:
        '200':
          description: API semantic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Problem'

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions visible to the authenticated caller
      x-runtime-availability: unavailable-default
      description: >
        Contract-only until the ST-212 test-only composition is reviewed. The
        trusted current principal and transaction-scoped RLS determine visibility.
        scope=me selects owned rows; scope=household selects rows routed through
        one of the caller's active household memberships, including owned rows
        only when they have such a route. Peers see an active explicit share even
        when always_private=true; always_private blocks only the open_book route.
        The household scope spans active memberships and de-duplicates a
        subscription visible through several households. Neither
        scope nor cursor grants authority. member:<memberId> is unsupported here
        because it would select another person's rows. No totals are returned.
        DETECTED rows are owner-only, including when a share or open_book would
        otherwise make the subscription visible. The scoped SQL query applies
        (identity_id=trusted caller OR status<>DETECTED) before keyset pagination
        and limit+1; RLS alone permits peer DETECTED reads.
        Results are ordered by immutable (created_at DESC, id DESC), including
        an id tie-breaker. A nextCursor continues strictly after the last item;
        every page re-evaluates current visibility, so revocation can shorten a page.
      security:
        - V1AccessBearer: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionScope'
        - $ref: '#/components/parameters/SubscriptionStatusFilter'
        - $ref: '#/components/parameters/SubscriptionCategoryFilter'
        - $ref: '#/components/parameters/SubscriptionCursor'
        - $ref: '#/components/parameters/SubscriptionLimit'
      responses:
        '200':
          description: A bounded page of currently visible subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        '400': { $ref: '#/components/responses/SubscriptionProblem' }
        '401': { $ref: '#/components/responses/SubscriptionProblem' }
        default: { $ref: '#/components/responses/SubscriptionProblem' }

  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: Get one subscription visible to the authenticated caller
      x-runtime-availability: unavailable-default
      description: >
        Apply the same current RLS visibility and the SQL predicate
        (identity_id=trusted caller OR status<>DETECTED) as list. Missing and invisible IDs
        return the identical 404 SUBSCRIPTION_NOT_FOUND problem, without owner or
        share metadata. No charge, transaction, bank account or detection evidence
        is included.
      security:
        - V1AccessBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner or peer-safe subscription projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisibleSubscription' }
        '400': { $ref: '#/components/responses/SubscriptionProblem' }
        '401': { $ref: '#/components/responses/SubscriptionProblem' }
        '404': { $ref: '#/components/responses/SubscriptionProblem' }
        default: { $ref: '#/components/responses/SubscriptionProblem' }
    patch:
      operationId: patchSubscriptionLifecycle
      summary: Request an owner-only ordinary lifecycle status transition
      x-runtime-availability: unavailable-default
      description: >
        Contract-only ST-215 slice; no HTTP mutation route is enabled. The accepted
        V1 current-session Bearer principal must own the subscription. Neither
        the body nor any query parameter can nominate a principal, scope, action
        or edit field. Reject every query parameter with 400, including unknown
        parameters.
        The private writer evaluates the locked current status atomically. Only
        ACTIVE to PAUSED/CANCELLED/ARCHIVED, PAUSED to ACTIVE/CANCELLED/ARCHIVED,
        and CANCELLED to ARCHIVED are accepted. All other pairs, including a
        same-status request, conflict. The target determines the action:
        ACTIVE=resume, PAUSED=pause, CANCELLED=cancel, ARCHIVED=archive; an
        unlocked read is never used for dispatch. A lost success response may
        make a retry return 409; re-read authoritative state after uncertainty.
        This operation has no replay receipt or exactly-once guarantee.
      security:
        - V1AccessBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionLifecyclePatch' }
      responses:
        '200':
          description: Bounded status result after an accepted owner transition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionLifecycleResult' }
        '400': { $ref: '#/components/responses/SubscriptionLifecycleProblem' }
        '401': { $ref: '#/components/responses/SubscriptionLifecycleProblem' }
        '404': { $ref: '#/components/responses/SubscriptionLifecycleProblem' }
        '409': { $ref: '#/components/responses/SubscriptionLifecycleProblem' }
        '500': { $ref: '#/components/responses/SubscriptionLifecycleProblem' }

  /v1/review-inbox:
    get:
      operationId: listReviewInbox
      summary: List the authenticated owner's DETECTED subscriptions
      x-runtime-availability: unavailable-default
      description: >
        Owner-only actionable DETECTED rows; household shares and open_book never
        grant access. No scope, owner or status selector is accepted. Results use
        immutable (created_at DESC, id DESC) ordering and current owner/RLS checks
        on every page. A nextCursor continues strictly after the last item.
        The SQL query requires identity_id=trusted caller AND status=DETECTED
        before pagination and limit+1. Detection reason codes exclude params
        and raw evidence.
      security:
        - V1AccessBearer: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionCursor'
        - $ref: '#/components/parameters/SubscriptionLimit'
      responses:
        '200':
          description: A bounded owner-only review page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewInboxPage' }
        '400': { $ref: '#/components/responses/SubscriptionProblem' }
        '401': { $ref: '#/components/responses/SubscriptionProblem' }
        default: { $ref: '#/components/responses/SubscriptionProblem' }

  /v2/subscriptions/{id}:
    patch:
      operationId: patchV2BrowserSubscriptionLifecycle
      summary: Request an owner-only lifecycle transition from the current browser session
      x-runtime-availability: unavailable-default
      description: >
        Contract only; this route is unavailable in the default application graph.
        Require direct HTTPS, exactly one Origin matching the configured allowlist,
        exactly one st_v2_access cookie and one distinct deployment-configured
        browser binding cookie, and exactly one session-bound X-Session-CSRF.
        Reject duplicate credentials or headers, Authorization (including Bearer
        and Refresh), st_v2_refresh, Idempotency-Key, mixed modes, and every query
        parameter with 400 before reading owner data. Reject any body other than
        JSON with exactly one status target; no caller identity, owner, household,
        scope, action, transport or edit selector is accepted. Verify the v2 access
        token to derive sid/sub, hash the observed binding cookie, call
        webContextForCurrentSession(sid,{userId:sub},bindingCookieHash,exactOrigin,observedAt),
        then DevelopmentV2PrincipalResolver.resolve with the trusted browser chain
        and exact Origin. Compare its current owner/session with verified sub/sid;
        recheck current session, binding and chain after asynchronous resolution,
        then verify SessionCsrfGuard for that identity/session before creating the
        server-only subscription RequestContext. The owner-scoped private writer
        uses a locked current row under transaction-local ordinary-role PostgreSQL
        RLS. Only ACTIVE to PAUSED/CANCELLED/ARCHIVED, PAUSED to
        ACTIVE/CANCELLED/ARCHIVED, and CANCELLED to ARCHIVED are accepted. All
        other pairs, including same-status, conflict. The target determines the
        action: ACTIVE=resume, PAUSED=pause, CANCELLED=cancel, ARCHIVED=archive;
        no unlocked read drives dispatch. Missing and foreign IDs return the
        identical 404 problem. After 409 or an uncertain PATCH response, perform
        an authenticated authoritative POST /v2/subscriptions/{id}/read; never
        infer success, optimistically mutate, automatically retry PATCH, fall back
        to V1 authority or convert tokens. If re-read fails, clear the private
        view and disable lifecycle actions until a fresh authenticated read.
        This PATCH has no replay receipt, nonce mutation, mutating-POST
        idempotency reservation or exactly-once guarantee.
      security:
        - V2WebAccessCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ExactOrigin'
        - in: header
          name: X-Session-CSRF
          required: true
          schema: { type: string, minLength: 1 }
          description: Exactly one token bound to the verified current browser identity and session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionLifecyclePatch' }
      responses:
        '200':
          description: Bounded status result after an accepted owner transition.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionLifecycleResult' }
        '400': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }
        '401': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }
        '403': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }
        '404': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }
        '409': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }
        '500': { $ref: '#/components/responses/BrowserSubscriptionLifecycleProblem' }

  /v2/subscriptions/{id}/read:
    post:
      operationId: readV2BrowserSubscription
      summary: Read one subscription visible to the current browser session
      x-runtime-availability: unavailable-default
      description: >
        Contract only; this route is unavailable in the default application graph.
        Require direct HTTPS, exactly one Origin matching the configured allowlist,
        exactly one st_v2_access cookie and one distinct deployment-configured
        browser binding cookie, and exactly one session-bound X-Session-CSRF.
        Reject duplicate credentials or headers, Authorization (including Bearer
        and Refresh), st_v2_refresh, mixed modes, every query parameter and every
        body other than JSON {} before reading owner data. No caller identity,
        owner, scope or transport selector is accepted. Verify the v2 access token
        to derive sid/sub, hash the observed binding cookie, call
        webContextForCurrentSession(sid,{userId:sub},bindingCookieHash,exactOrigin,observedAt),
        then DevelopmentV2PrincipalResolver.resolve with the trusted browser chain
        and exact Origin. Compare its current owner/session with verified sub/sid;
        verify SessionCsrfGuard for that identity/session before creating the
        server-only subscription RequestContext. Apply the same current RLS and
        owner/household visibility predicate as V1 detail: owner or peer-safe
        projection only, with canonical string minor units; no transaction,
        charge, bank or detection evidence. Missing and foreign IDs have the
        identical 404 problem, with no owner or share metadata. This POST is a
        pure read: no nonce, session, CSRF or subscription mutation or rotation,
        and no idempotency reservation or Idempotency-Key. ADR-0010 requires
        idempotency only for mutating POSTs. Never fall back to V1 authority.
      security:
        - V2WebAccessCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ExactOrigin'
        - in: header
          name: X-Session-CSRF
          required: true
          schema: { type: string, minLength: 1 }
          description: Exactly one token bound to the verified current browser identity and session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSubscriptionReadRequest' }
      responses:
        '200':
          description: Owner or peer-safe subscription projection.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisibleSubscription' }
        '400': { $ref: '#/components/responses/BrowserSubscriptionReadProblem' }
        '401': { $ref: '#/components/responses/BrowserSubscriptionReadProblem' }
        '403': { $ref: '#/components/responses/BrowserSubscriptionReadProblem' }
        '404': { $ref: '#/components/responses/BrowserSubscriptionReadProblem' }
        '500': { $ref: '#/components/responses/BrowserSubscriptionReadProblem' }

  /v2/auth/browser-nonce:
    post:
      operationId: createV2BrowserNonce
      summary: Issue a one-use browser nonce and binding cookie
      description: >
        Browser-only bootstrap. Require HTTPS outside local development and an
        exact configured Origin allowlist match; reject Origin null, wildcard or
        reflected credentialed CORS. Set a distinct host-only Secure; HttpOnly;
        SameSite=Lax binding cookie (Domain omitted), and return the public nonce
        for a custom request header. The binding cookie is not the nonce. Every
        mutating POST requires Idempotency-Key; idempotent retries must never
        replay a code, proof, or bypass throttles. Nonces are purpose, origin,
        challenge-chain and cookie-pair bound, short-lived and single-use.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Bootstrap a fresh nonce with a unique key; it invalidates the prior browser chain.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserNonceRequest'
      responses:
        '200':
          description: Public nonce; binding cookie is set separately.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
            Set-Cookie:
              schema: { type: string }
              description: >
                Host-only Secure; HttpOnly; SameSite=Lax binding cookie. Cookie
                name and Path are deployment-configured; Domain is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserNonceResponse'
        '400': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/auth/otp/start:
    post:
      x-wire-call-envelopes: ['WebOtpStartCallEnvelope', 'MobileOtpStartCallEnvelope']
      operationId: startV2Otp
      summary: Start identifier verification or OTP step-up
      description: >
        Does not select or create a principal. Normalize identifier/channel and
        throttle by IP and identifier. Return generic status, body and timing;
        202 does not assert delivery or account existence. Browser requests also
        require the nonce header, binding cookie and exact Origin; consume and
        rotate the browser nonce and return the next nonce. Idempotency-Key is
        required, but retries never replay codes or bypass throttles.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Start a fresh challenge on a fresh nonce chain and obey the existing throttles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/BrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpStartRequest'
      responses:
        '202':
          description: Generic accepted response; no identity or delivery claim.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpStartResponse'
        '400': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '429': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/auth/otp/verify:
    post:
      x-wire-call-envelopes: ['WebOtpVerifyCallEnvelope', 'MobileOtpVerifyCallEnvelope']
      operationId: verifyV2Otp
      summary: Verify an OTP challenge and issue a restricted proof
      description: >
        Returns an opaque one-use proof bound to purpose, initiating challenge,
        normalized identifier hash where applicable, selected transport and
        browser nonce chain; proofs expire after five minutes. Enrollment proof only permits the mandatory BankID
        continuation; step-up proof cannot establish login. No provider fields
        or client-asserted BankID result are accepted. Browser nonce is consumed
        and rotated; response returns the next public nonce. Idempotency retries
        cannot replay a proof.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Obtain a fresh challenge and verify again under existing throttles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/BrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Restricted one-use proof; no-store.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400': { $ref: '#/components/responses/V2Problem' }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '429': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/auth/enrollment/pending:
    post:
      operationId: admitV2WebEnrollment
      summary: Admit restricted identifier proof to pending private web enrollment
      x-runtime-availability: unavailable-default
      x-wire-call-envelopes: ['WebEnrollmentPendingCallEnvelope']
      description: >
        Contract only, disabled by default and unavailable outside explicitly
        opted-in private development HTTPS web. Apply WebEnrollmentHeaders and
        WebEnrollmentCookies authority rules. Require enroll_identifier nonce;
        resolve coherent challenge/hash/channel/private normalized contact only
        from server issuance metadata and secret-bound enrollment/enroll-credential
        proof. No client identity/contact/challenge/provider/name/role selector.
        Atomically consume restricted proof once, create bounded pending record,
        rotate enroll_identifier nonce on the same Origin/chain/binding cookie
        and settle owned reservation. OTP never establishes login or an account.
        Pending expiry is at most five minutes and cannot outlive source proof
        or contact metadata; at most 10000 pending records, no renewal/revival.
        Independently commit global Idempotency-Key burn before mutation, bound
        to this operation/web/trusted browser-chain/keyed strict request digest;
        pending/completed/failed duplicates are generic 409 AUTH_RESTART_REQUIRED,
        never replay. Lost or uncertain responses require fresh verified login
        and nonce, no automatic retry or compensation; unknown orphans expire.
        Existing OTP stores only hash/channel and proof consumption returns a
        boolean; coherent contact/proof metadata resolution and transaction-bound
        consumption are future prerequisites, not existing capabilities.
        The qualified private durable composition uses WebEnrollmentProblem's
        collapsed 409 boundary; 401/429 require separately trusted classification.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebEnrollmentIdempotencyKey'
        - $ref: '#/components/parameters/ExactOrigin'
        - $ref: '#/components/parameters/WebEnrollmentBrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebEnrollmentPendingRequest' }
      responses:
        '201':
          description: Pending admission only; no account or login authority.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
            Pragma: { required: true, schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebEnrollmentPendingResponse' }
        '400': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '401': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '403': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '404': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '409': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '429': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '500': { $ref: '#/components/responses/WebEnrollmentProblem' }

  /v2/auth/enrollment/simulator/verify:
    post:
      operationId: verifyV2WebSimulatorEnrollment
      summary: Verify mandatory server simulator authority for private web enrollment
      x-runtime-availability: unavailable-default
      x-wire-call-envelopes: ['WebEnrollmentSimulatorCallEnvelope']
      description: >
        Contract only, disabled by default and unavailable outside explicitly
        opted-in private development HTTPS web. Apply WebEnrollmentHeaders and
        WebEnrollmentCookies authority rules. Require enroll_identifier nonce
        and matched live pending continuation. Mandatory trusted server simulator
        verification occurs outside account locks; never accept provider tokens,
        results, subject, contact, names or identity selectors from the client.
        Recheck immutable bindings/clock/expiry after awaits. Atomically consume
        pending continuation, create separate authoritative one-use enrollment
        record (subject-HMAC/verified-at/trusted names), settle owned reservation
        and consume enrollment nonce into fresh session-purpose nonce on the SAME
        Origin/chain/binding cookie. Bind authoritative record to terminal nonce
        digest; restricted OTP proof is never converted to login. Authoritative
        expiry is at most five minutes and cannot outlive pending expiry; at most
        10000 authoritative records, no renewal/revival. Session nonce retains
        exact five-minute TTL; authoritative expiry remains the tighter bound.
        Independently commit global Idempotency-Key burn before provider work,
        bound to operation/web/trusted browser-chain/keyed strict request digest.
        Pending/completed/failed duplicates are generic 409 AUTH_RESTART_REQUIRED,
        never replay. Lost/uncertain response requires fresh verified login/nonce,
        no automatic retry or compensation; unknown orphans expire. Current nonce
        consumeAndRotate preserves purpose: this cross-purpose transition is a
        future reviewed core prerequisite. Existing registered-login simulator
        producer cannot supply authoritative enrollment; trusted given/surname
        extension is separately reviewed, never split full name or invent fields.
        The qualified private durable composition uses WebEnrollmentProblem's
        collapsed 409 boundary; 401/429 require separately trusted classification.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebEnrollmentIdempotencyKey'
        - $ref: '#/components/parameters/ExactOrigin'
        - $ref: '#/components/parameters/WebEnrollmentBrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebEnrollmentSimulatorRequest' }
      responses:
        '200':
          description: Separate verified enrollment authority; not a login proof.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
            Pragma: { required: true, schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebEnrollmentSimulatorResponse' }
        '400': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '401': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '403': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '404': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '409': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '429': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '500': { $ref: '#/components/responses/WebEnrollmentProblem' }

  /v2/auth/enrollment/complete:
    post:
      operationId: completeV2WebEnrollment
      summary: Terminally complete private web account and cookie session atomically
      x-runtime-availability: unavailable-default
      x-wire-call-envelopes: ['WebEnrollmentCompleteCallEnvelope']
      description: >
        Contract only, disabled by default and unavailable outside explicitly
        opted-in private development HTTPS web. Apply WebEnrollmentHeaders and
        WebEnrollmentCookies authority rules. Require session-purpose nonce bound
        to matched live authoritative enrollment and same Origin/chain/cookie.
        Independently commit global Idempotency-Key burn before mutation, bound
        to operation/web/trusted browser-chain/keyed strict request digest.
        Single connection/transaction locks owned reservation, authoritative
        record and nonce; rechecks bindings/clock/expiry; uses existing provisioner
        identity SELECT(id,external_id)/INSERT, then ordinary owner RequestContext.
        Atomically write new account/private verified fields/contact/defaults,
        session/family/CSRF, terminally consume nonce and authoritative record,
        and settle completed. No successor nonce. Registered active subject gives
        409 ENROLLMENT_LOGIN_REQUIRED only after trusted verification; explicit
        later verified login, no enrollment session/relink/contact/profile overwrite.
        Deleted subject/contact conflict/insertion-race loser gives generic
        409 AUTH_RESTART_REQUIRED. Expired/consumed/mismatched authority fails closed.
        Rollback leaves independently committed burn; crash pending expires.
        Pending/completed/failed duplicate 409 never replays credentials. Lost or
        uncertain response requires fresh verified login/nonce, no automatic retry
        or destructive compensation; unknown orphan sessions expire. Only after
        commit set exclusive secure access/refresh cookies, CSRF in memory; no
        credentials in body/URL/local storage/logs. Access15min/session24h unchanged.
        New idempotency operation allowlist and async reserve/settle transaction
        ports remain future core prerequisites. Profile/Just me, SQL objects/grants
        and current-versus-predecessor consumed-refresh CSRF policy remain separate
        security-reviewed gates; this contract authorizes or selects none of them.
        The qualified private durable composition uses WebEnrollmentProblem's
        collapsed 409 boundary; 401/429 require separately trusted classification.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebEnrollmentIdempotencyKey'
        - $ref: '#/components/parameters/ExactOrigin'
        - $ref: '#/components/parameters/WebEnrollmentBrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebEnrollmentCompleteRequest' }
      responses:
        '201':
          description: New account/session committed; public session id and in-memory CSRF only.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
            Pragma: { required: true, schema: { type: string, const: no-cache } }
            Set-Cookie:
              required: true
              schema: { type: string }
              description: >
                Separate postcommit Set-Cookie headers for st_v2_access Path=/v2
                and st_v2_refresh Path=/v2/auth; host-only Secure; HttpOnly;
                SameSite=Lax; Domain omitted. Existing binding cookie preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionResponse' }
        '400': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '401': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '403': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '404': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '409': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '429': { $ref: '#/components/responses/WebEnrollmentProblem' }
        '500': { $ref: '#/components/responses/WebEnrollmentProblem' }

  /v2/auth/session:
    post:
      x-wire-call-envelopes: ['WebSessionCallEnvelope', 'MobileSessionCallEnvelope']
      operationId: createV2Session
      summary: Redeem a server-issued login proof for a session
      description: >
        Login proof must come from server-verified BankID, or a server-verified
        registered mobile passkey/biometric assertion plus OTP. ST170b proof
        producer integration is a prerequisite; this contract does not claim
        client readiness. Proof is one-use, transport-bound, and cannot switch
        web/mobile modes. OTP enrollment and step-up proofs are not login proofs.
        Store only proof hashes and redeem atomically. Web transport requires
        the current public X-Browser-Nonce paired with the distinct HttpOnly
        binding cookie and exact allowlisted Origin. The login proof must match
        the same trusted browser chain. On successful web redemption, consume
        the nonce terminally without issuing a successor; subsequent unsafe
        cookie calls use the distinct session-bound CSRF token. Mobile omits
        browser nonce, Origin and CSRF headers. no-store responses. Web
        cookies are host-only Secure; HttpOnly; SameSite=Lax: st_v2_access Path
        /v2 and st_v2_refresh Path /v2/auth; omit Domain and do not use __Host-
        with narrower paths. Web returns a distinct readable session-bound CSRF
        token. Mobile receives the access JWT and opaque refresh secret once for OS secure storage.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Discard local credentials and complete a fresh server-verified login and fresh browser nonce chain for web; ST170b is required. After login, owner-scoped session listing/revocation can address a known prior sessionId; an unknown orphan expires normally.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/BrowserNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '201':
          description: Session created. no-store; web sets access and refresh cookies.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
            Set-Cookie:
              schema: { type: string }
              description: >
                Web only: host-only Secure; HttpOnly; SameSite=Lax cookies with
                st_v2_access Path=/v2 and st_v2_refresh Path=/v2/auth. Domain omitted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WebSessionResponse'
                  - $ref: '#/components/schemas/MobileSessionResponse'
        '400': { $ref: '#/components/responses/V2Problem' }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/auth/refresh:
    post:
      x-wire-call-envelopes: ['WebRefreshCallEnvelope', 'MobileRefreshCallEnvelope']
      operationId: refreshV2Session
      summary: Rotate refresh credential within the selected transport
      description: >
        Request body is forbidden. Web uses only st_v2_refresh cookie with exact
        Origin and session-bound CSRF header; mobile uses only Authorization:
        Refresh <opaque-secret>, never body or query. Reject mixed cookie and
        Authorization credentials. Atomically consume one active refresh hash
        and create one same-identity, same-family successor; concurrent losers
        create none and consumed-token reuse revokes the family. Retain consumed
        hashes for the applicable refresh lifetime. No-store. Idempotency-Key is
        required and cannot replay secrets or bypass rotation.
        If outcome is uncertain, never retry the old refresh credential: reuse revokes its family. Discard local credentials and complete fresh verified login; afterward use owner-scoped session listing/revocation for any known prior sessionId. An unknown orphan expires normally. A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebRefreshCookie: []
        - V2MobileRefresh: []
      responses:
        '200':
          description: Rotated credentials. no-store; web rotates cookies.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
            Set-Cookie:
              schema: { type: string }
              description: Web only; same attributes and paths as session creation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WebRefreshResponse'
                  - $ref: '#/components/schemas/MobileRefreshResponse'
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/me/sessions:
    get:
      operationId: listV2Sessions
      summary: List sessions owned by the authenticated caller
      description: >
        Derive identity and session only from an active v2 server-validated
        credential. Never accept an identity selector or fall back to v1.
        Reject cookie plus Bearer credentials; mobile protected calls use only
        Bearer access JWT. Session list is owner-scoped.
      security:
        - V2WebAccessCookie: []
        - V2AccessBearer: []
      responses:
        '200':
          description: Caller-owned sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/me/sessions/{id}:
    delete:
      operationId: revokeV2Session
      summary: Revoke one caller-owned session
      description: >
        Revoke only a session belonging to authenticated identity. Web requires
        exact Origin and session-bound CSRF; Bearer mobile requires no cookie
        CSRF. Reject mixed credentials and unknown/foreign IDs without exposing
        ownership.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
        - V2AccessBearer: []
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '404': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/me/reauth/otp/start:
    post:
      operationId: startV2DeleteOtpReauth
      summary: Start development-only same-principal delete reauthentication
      description: >
        Authenticated caller only. Server resolves caller's registered identifier
        from session context; no identity, identifier, environment, or method
        selector is accepted. Enforce AUTH_DELETE_OTP_DEV_ONLY=true and explicit
        development mode, failing closed elsewhere. Challenge is bound to same
        principal and session, account-delete action and transport. Generic 202
        does not assert delivery. Web requires exact Origin and session CSRF.
        Idempotency retries do not replay codes or bypass throttles.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Start a fresh challenge on a fresh nonce chain and obey the existing throttles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
        - V2AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteOtpStartRequest' }
      responses:
        '202':
          description: Generic challenge accepted.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteOtpStartResponse' }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '429': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/me/reauth/otp/verify:
    post:
      operationId: verifyV2DeleteOtpReauth
      summary: Verify development-only account-delete OTP reauthentication
      description: >
        Authenticated same principal and session as challenge start. Enforce
        AUTH_DELETE_OTP_DEV_ONLY=true plus explicit development mode and fail
        closed elsewhere. Atomically verify and consume caller-owned challenge;
        issue opaque reauthProof bound only to same principal/session and account
        deletion, never a login proof. Web requires exact Origin and session CSRF.
        no-store; Idempotency-Key retry cannot replay proof.
        A committed one-use operation whose response is lost cannot be replayed: return generic 409 AUTH_RESTART_REQUIRED without any code, token or proof. Obtain a fresh challenge and verify again under existing throttles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
        - V2AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteOtpVerifyRequest' }
      responses:
        '200':
          description: Deletion-only proof; no-store.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteOtpVerifyResponse' }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '409': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

  /v2/me/profile/read:
    post:
      operationId: readV2BrowserProfile
      summary: Read the current browser owner's persisted private profile
      description: >
        Same-origin HTTPS web cookie request only. Requires exactly one Origin,
        X-Session-CSRF, st_v2_access cookie and distinct browser-binding cookie,
        with the current browser chain and current session CSRF. The JSON body
        must be exactly {}. No query, Authorization, refresh credential,
        Idempotency-Key, owner selector or method override is accepted. A fresh
        owner-scoped read does not rotate session, nonce or CSRF. Every response
        is no-store and no-cache.
      parameters:
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileReadRequest' }
      responses:
        '200': { $ref: '#/components/responses/BrowserProfileView' }
        '400': { $ref: '#/components/responses/BrowserProfileProblem' }
        '401': { $ref: '#/components/responses/BrowserProfileProblem' }
        '403': { $ref: '#/components/responses/BrowserProfileProblem' }
        '409': { $ref: '#/components/responses/BrowserProfileProblem' }
        '500': { $ref: '#/components/responses/BrowserProfileProblem' }
  /v2/me/profile:
    patch:
      operationId: patchV2BrowserProfile
      summary: Patch the current browser owner's private profile
      description: >
        Same current web cookie, exact Origin, browser binding and chain, and
        X-Session-CSRF requirements as profile read. No query, Authorization,
        refresh credential, Idempotency-Key, owner selector or method override.
        The returned view represents a known committed update. An uncertain
        result must not be replayed automatically. Every response is no-store
        and no-cache.
      parameters:
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { $ref: '#/components/responses/BrowserProfileView' }
        '400': { $ref: '#/components/responses/BrowserProfileProblem' }
        '401': { $ref: '#/components/responses/BrowserProfileProblem' }
        '403': { $ref: '#/components/responses/BrowserProfileProblem' }
        '409': { $ref: '#/components/responses/BrowserProfileProblem' }
        '500': { $ref: '#/components/responses/BrowserProfileProblem' }
  /v2/me:
    delete:
      operationId: deleteV2Me
      summary: Delete the authenticated caller's account
      description: >
        Requires the current active same-principal session plus independent
        deletion-only reauthProof consumed atomically. Production proof requires
        recent BankID verification; development OTP proof is accepted only with
        explicit development mode and AUTH_DELETE_OTP_DEV_ONLY=true. Web always
        requires exact Origin and session-bound CSRF. Never trust proof alone or
        accept an identity selector. Mobile uses Bearer access credential.
      parameters:
        - $ref: '#/components/parameters/OriginForWeb'
        - $ref: '#/components/parameters/SessionCsrf'
      security:
        - V2WebAccessCookie: []
        - V2AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteMeRequest' }
      responses:
        '204': { description: Account deleted. }
        '400': { $ref: '#/components/responses/V2Problem' }
        '401': { $ref: '#/components/responses/V2Problem' }
        '403': { $ref: '#/components/responses/V2Problem' }
        '404': { $ref: '#/components/responses/V2Problem' }
        default: { $ref: '#/components/responses/V2Problem' }

components:
  schemas:
    ProfileReadRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Exact empty JSON object; current session CSRF remains required.
    ProfilePatch:
      description: Private profile data patch; no identity, owner, contact, provider, session or household authority. A later writer must scope it from trusted context.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80, description: 'Already NFC and trim-stable; 1-80 Unicode scalar values, no Cc/Cf or unpaired surrogate.' }
        avatarColourToken: { type: [string, 'null'], enum: [member.accent.01, member.accent.02, member.accent.03, member.accent.04, member.accent.05, member.accent.06, member.accent.07, member.accent.08, null] }
        avatarEmoji: { type: [string, 'null'], enum: [🙂, 😀, 😎, 🌟, 🌿, 🐱, 🦊, 🦉, null] }
        language: { type: string, enum: [sv, en] }
        theme: { type: string, enum: [system, light, dark] }
    ProfileView:
      description: Closed private profile projection. A complete profile requires a valid nonnull displayName; incomplete may have null or a valid name.
      type: object
      additionalProperties: false
      required: [displayName, avatarColourToken, avatarEmoji, language, theme, defaultCurrency, profileComplete]
      properties:
        displayName: { type: [string, 'null'], minLength: 1, maxLength: 80, description: Nonnull when profileComplete; already NFC and trim-stable with 1-80 Unicode scalar values and no Cc/Cf or unpaired surrogate. }
        avatarColourToken: { type: [string, 'null'], enum: [member.accent.01, member.accent.02, member.accent.03, member.accent.04, member.accent.05, member.accent.06, member.accent.07, member.accent.08, null] }
        avatarEmoji: { type: [string, 'null'], enum: [🙂, 😀, 😎, 🌟, 🌿, 🐱, 🦊, 🦉, null] }
        language: { type: string, enum: [sv, en] }
        theme: { type: string, enum: [system, light, dark] }
        defaultCurrency: { type: string, const: SEK }
        profileComplete: { type: boolean }
    BrowserProfileProblem:
      description: Closed generic RFC 9457 profile failure. Code is fixed by status; no private detail or owner existence.
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, enum: [Bad Request, Unauthorized, Forbidden, Conflict, Internal Server Error] }
        status: { type: integer, enum: [400, 401, 403, 409, 500] }
        code: { type: string, enum: [INVALID_PROFILE_REQUEST, AUTHENTICATION_REQUIRED, PROFILE_REQUEST_REJECTED, PROFILE_CONFLICT, INTERNAL_ERROR] }
    JustMeChoice:
      description: Explicit data choice after a persisted completed profile. A future trusted caller enforces that prerequisite; this component creates no household, membership or consent.
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, const: just-me }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: Current API semantic version.
    SetOpenBookBody:
      type: object
      additionalProperties: false
      required: [householdId, openBook]
      properties:
        householdId:
          type: string
          format: uuid
        openBook:
          type: boolean
          description: true = share subscriptions with household peers; false (default) = private.

    ConsentSetting:
      type: object
      additionalProperties: false
      required: [householdId, openBook, updatedAt]
      properties:
        householdId:
          type: string
          format: uuid
        openBook:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [id, categoryCode, cadence, status]
      properties:
        id:
          type: string
          format: uuid
        customName:
          type: [string, 'null']
        categoryCode:
          type: string
        cadence:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM]
        status:
          type: string
          enum: [DETECTED, TRIAL, ACTIVE, PAUSED, CANCELLED, ARCHIVED, REJECTED]
        alwaysPrivate:
          type: boolean
          description: Only present for the subscription owner — never exposed to other members.

    SubscriptionReadStatus:
      type: string
      enum: [DETECTED, TRIAL, ACTIVE, PAUSED, CANCELLED, ARCHIVED, REJECTED]
    SubscriptionLifecycleTarget:
      type: string
      enum: [ACTIVE, PAUSED, CANCELLED, ARCHIVED]
    SubscriptionLifecyclePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/SubscriptionLifecycleTarget' }
    SubscriptionLifecycleResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SubscriptionLifecycleTarget' }
    SubscriptionLifecycleError:
      type: object
      additionalProperties: false
      description: RFC 9457 problem; no resource, principal, query or driver details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, enum: [400, 401, 404, 409, 500] }
        code:
          type: string
          enum: [INVALID_SUBSCRIPTION_LIFECYCLE_REQUEST, AUTHENTICATION_REQUIRED, SUBSCRIPTION_NOT_FOUND, LIFECYCLE_CONFLICT, INTERNAL_ERROR]
    BrowserSubscriptionLifecycleError:
      type: object
      additionalProperties: false
      description: RFC 9457 problem; no resource, principal, credential, query or driver details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, enum: [400, 401, 403, 404, 409, 500] }
        code:
          type: string
          enum: [INVALID_SUBSCRIPTION_LIFECYCLE_REQUEST, AUTHENTICATION_REQUIRED, AUTH_CSRF_UNAVAILABLE, SUBSCRIPTION_NOT_FOUND, LIFECYCLE_CONFLICT, INTERNAL_ERROR]
    SubscriptionPeerReadStatus:
      type: string
      enum: [TRIAL, ACTIVE, PAUSED, CANCELLED, ARCHIVED, REJECTED]
    SubscriptionReadCadence:
      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM]
    CanonicalMinorUnits:
      type: string
      pattern: '^(0|-?[1-9][0-9]*)$'
      description: >
        Signed base-10 integer minor units. No leading zero, negative zero,
        plus sign, exponent, decimal point or whitespace; field-specific Money
        validation still applies. PostgreSQL signed BIGINT storage bounds this
        read path to -9223372036854775808 through 9223372036854775807.
        A JSON number is never accepted.
      examples: ['0', '-9007199254740993']
    SubscriptionOwnerView:
      type: object
      additionalProperties: false
      required: [visibility, id, categoryCode, cadence, status, expectedAmountMinor, currency, alwaysPrivate]
      properties:
        visibility: { type: string, const: owner }
        id: { type: string, format: uuid }
        customName: { type: [string, 'null'] }
        merchantId: { type: [string, 'null'], format: uuid }
        merchantName: { type: [string, 'null'], description: 'Canonical merchant name, never raw transaction text.' }
        categoryCode: { type: string }
        cadence: { $ref: '#/components/schemas/SubscriptionReadCadence' }
        status: { $ref: '#/components/schemas/SubscriptionReadStatus' }
        expectedAmountMinor: { $ref: '#/components/schemas/CanonicalMinorUnits' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        nextChargeDate: { type: [string, 'null'], format: date }
        alwaysPrivate: { type: boolean }
    SubscriptionPeerView:
      type: object
      additionalProperties: false
      required: [visibility, id, categoryCode, cadence, status, expectedAmountMinor, currency]
      properties:
        visibility: { type: string, const: household }
        id: { type: string, format: uuid }
        categoryCode: { type: string }
        cadence: { $ref: '#/components/schemas/SubscriptionReadCadence' }
        status: { $ref: '#/components/schemas/SubscriptionPeerReadStatus' }
        expectedAmountMinor: { $ref: '#/components/schemas/CanonicalMinorUnits' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    VisibleSubscription:
      oneOf:
        - $ref: '#/components/schemas/SubscriptionOwnerView'
        - $ref: '#/components/schemas/SubscriptionPeerView'
    SubscriptionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/VisibleSubscription' }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Null at the end; never a count or owner/household selector.
    ReviewInboxItem:
      type: object
      additionalProperties: false
      required: [id, categoryCode, cadence, status, expectedAmountMinor, currency, confidence, reasonCodes]
      properties:
        id: { type: string, format: uuid }
        customName: { type: [string, 'null'] }
        merchantId: { type: [string, 'null'], format: uuid }
        merchantName: { type: [string, 'null'], description: 'Canonical merchant name, never raw transaction text.' }
        categoryCode: { type: string }
        cadence: { $ref: '#/components/schemas/SubscriptionReadCadence' }
        status: { type: string, const: DETECTED }
        expectedAmountMinor: { $ref: '#/components/schemas/CanonicalMinorUnits' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [MERCHANT_RESOLVED, CADENCE_MATCHED, MIN_OCCURRENCES_MET, DATE_PATTERN_STABLE, AMOUNT_WITHIN_BAND, SUBSCRIPTION_CATEGORY_PRIOR]
        catalogPlanId: { type: [string, 'null'], format: uuid }
    ReviewInboxPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ReviewInboxItem' }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
    SubscriptionReadProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 error; detail never reveals hidden resource metadata.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [INVALID_SUBSCRIPTION_QUERY, SUBSCRIPTION_NOT_FOUND, AUTHENTICATION_REQUIRED, INTERNAL_ERROR]
    BrowserSubscriptionReadRequest:
      type: object
      additionalProperties: false
      minProperties: 0
      maxProperties: 0
      description: Exactly an empty JSON object; no identity, scope or action fields.
    BrowserSubscriptionReadProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem with no credential, resource, owner, share or driver details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, enum: [400, 401, 403, 404, 500] }
        code:
          type: string
          enum: [INVALID_SUBSCRIPTION_QUERY, AUTHENTICATION_REQUIRED, AUTH_CSRF_UNAVAILABLE, SUBSCRIPTION_NOT_FOUND, INTERNAL_ERROR]

    ExportJobResponse:
      type: object
      additionalProperties: false
      required: [token, downloadUrl, expiresAt]
      properties:
        token:
          type: string
          description: Single-use download token (64 hex chars).
        downloadUrl:
          type: string
          description: Relative URL to download the ZIP archive.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp after which the download token expires.

    DeleteAccountBody:
      type: object
      additionalProperties: false
      required: [reAuthToken]
      properties:
        reAuthToken:
          type: string
          description: >
            BankID or OTP re-authentication credential. Required before personal
            data erasure. With A5 Assumed (dev/simulator), any non-empty string
            is accepted.


    # Client/server wire-call models. These envelopes are validation guidance for
    # adapters; actual HTTP sends body and headers in their normal locations.
    WebOtpStartBody:
      type: object
      additionalProperties: false
      required: [channel, identifier, purpose, transport]
      properties:
        channel: { type: string, enum: [sms, email] }
        identifier: { type: string }
        purpose: { type: string, enum: [enroll_identifier, otp_step_up] }
        transport: { type: string, const: web }
    WebOtpVerifyBody:
      type: object
      additionalProperties: false
      required: [challengeId, code, transport]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 1 }
        transport: { type: string, const: web }
    MobileOtpStartBody:
      type: object
      additionalProperties: false
      required: [channel, identifier, purpose, transport]
      properties:
        channel: { type: string, enum: [sms, email] }
        identifier: { type: string }
        purpose: { type: string, enum: [enroll_identifier, otp_step_up] }
        transport: { type: string, const: mobile }
    MobileOtpVerifyBody:
      type: object
      additionalProperties: false
      required: [challengeId, code, transport]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 1 }
        transport: { type: string, const: mobile }
    WebOtpStartWireCall:
      $ref: '#/components/schemas/WebOtpStartCallEnvelope'
    WebOtpStartCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebOtpStartHeaders' }
        body: { $ref: "#/components/schemas/WebOtpStartBody" }
    MobileOtpStartCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: mobile }
        headers: { $ref: '#/components/schemas/MobileOtpHeaders' }
        body: { $ref: "#/components/schemas/MobileOtpStartBody" }
    WebOtpVerifyCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebOtpHeaders' }
        body: { $ref: "#/components/schemas/WebOtpVerifyBody" }
    MobileOtpVerifyCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: mobile }
        headers: { $ref: '#/components/schemas/MobileOtpHeaders' }
        body: { $ref: "#/components/schemas/MobileOtpVerifyBody" }
    WebSessionCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebSessionHeaders' }
        body: { $ref: "#/components/schemas/WebSessionRequest" }
    MobileSessionCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: mobile }
        headers: { $ref: '#/components/schemas/MobileSessionHeaders' }
        body: { $ref: "#/components/schemas/MobileSessionRequest" }
    WebRefreshCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebRefreshHeaders' }
        body: { type: 'null', const: null }
    MobileRefreshCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, body]
      properties:
        transport: { type: string, const: mobile }
        headers: { $ref: '#/components/schemas/MobileRefreshHeaders' }
        body: { type: 'null', const: null }
    WebOtpStartHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, origin, browserNonce]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
        origin: { type: string, format: uri, description: Browser supplies Origin; client JavaScript must not set this forbidden header. }
        browserNonce: { type: string, description: Public X-Browser-Nonce value. }
    WebOtpHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, origin, browserNonce]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
        origin: { type: string, format: uri, description: Browser supplies Origin; client JavaScript must not set this forbidden header. }
        browserNonce: { type: string }
    MobileOtpHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
    WebSessionHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, origin, browserNonce]
      description: Web-only headers; the public nonce must pair with the distinct HttpOnly binding cookie and exact allowlisted Origin.
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
        origin: { type: string, format: uri, description: Browser supplies exact allowlisted Origin; client JavaScript must not set this forbidden header. }
        browserNonce: { type: string, description: 'Existing public X-Browser-Nonce value; terminally consumed on successful proof redemption, with no successor nonce.' }
    MobileSessionHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
    WebRefreshHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, origin, sessionCsrf]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
        origin: { type: string, format: uri, description: Browser supplies Origin; client JavaScript must not set this forbidden header. }
        sessionCsrf: { type: string }
    MobileRefreshHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, authorization]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 255 }
        authorization: { type: string, pattern: '^Refresh .+$', description: "Opaque refresh credential; no Origin, nonce or CSRF fields." }
    BrowserNonceRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [enroll_identifier, otp_step_up, session] }
    BrowserNonceResponse:
      type: object
      additionalProperties: false
      required: [nonce]
      properties:
        nonce: { type: string, description: "Public one-use nonce, sent by JS in a custom header." }
    OtpStartRequest:
      type: object
      additionalProperties: false
      required: [channel, identifier, purpose, transport]
      properties:
        channel: { type: string, enum: [sms, email] }
        identifier: { type: string, description: "Normalized server-side; never echoed." }
        purpose: { type: string, enum: [enroll_identifier, otp_step_up] }
        transport: { type: string, enum: [web, mobile] }
    OtpStartResponse:
      type: object
      additionalProperties: false
      required: [challengeId, status, nextBrowserNonce]
      properties:
        challengeId: { type: string }
        status: { type: string, const: accepted }
        nextBrowserNonce: { type: [string, 'null'], description: "Next public nonce for browser flow; null for mobile." }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code, transport]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 1 }
        transport: { type: string, enum: [web, mobile] }
    OtpVerifyResponse:
      type: object
      additionalProperties: false
      required: [purpose, proof, nextBrowserNonce]
      properties:
        purpose: { type: string, enum: [enroll_identifier, otp_step_up] }
        proof: { type: string, description: "Opaque one-use purpose and transport-bound proof; store hash only." }
        nextBrowserNonce: { type: [string, 'null'], description: "Next public nonce for browser flow; null for mobile." }
    WebEnrollmentIdentifierProof:
      type: string
      pattern: '^v2\.[A-Za-z0-9_-]{43}$'
      minLength: 46
      maxLength: 46
      description: Restricted secret enrollment/enroll-credential proof; never login authority.
    WebEnrollmentContinuation:
      type: string
      pattern: '^wep\.[A-Za-z0-9_-]{43}$'
      minLength: 47
      maxLength: 47
      description: Distinct pending-enrollment opaque handle; in memory only, hash stored server-side.
    WebVerifiedEnrollment:
      type: string
      pattern: '^wev\.[A-Za-z0-9_-]{43}$'
      minLength: 47
      maxLength: 47
      description: Separate one-use authoritative enrollment handle; never a login proof, in memory only.
    WebEnrollmentNonce:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
    WebEnrollmentKey:
      type: string
      pattern: '^[\x21-\x7e]{16,255}$'
      minLength: 16
      maxLength: 255
    WebEnrollmentHeaders:
      type: object
      additionalProperties: false
      required: [idempotencyKey, origin, browserNonce]
      description: >
        Exactly one Idempotency-Key, exact configured HTTPS Origin and
        X-Browser-Nonce. Direct HTTPS only. Browser manages Origin; JavaScript
        must not set it. Reject every query parameter, duplicate/framing ambiguity,
        Authorization, access/refresh cookies, X-Session-CSRF and legacy authority
        headers with 400 before work. Origin/chain/binding mismatch is 403.
        These adapter envelopes describe normalized wire evidence; SDK calls
        alone cannot enforce duplicate headers, cookies or exact allowlist matching.
      properties:
        idempotencyKey: { $ref: '#/components/schemas/WebEnrollmentKey' }
        origin: { type: string, format: uri, pattern: '^https://[^/?#]+$' }
        browserNonce: { $ref: '#/components/schemas/WebEnrollmentNonce' }
    WebEnrollmentCookies:
      type: object
      additionalProperties: false
      required: [bindingCookie]
      description: >
        Server-observed exactly one deployment-configured distinct binding cookie;
        host-only Secure; HttpOnly; SameSite=Lax; Domain omitted, configured Path.
        Same cookie throughout rotations; never expose cookie to JavaScript.
        Access/refresh credentials are forbidden on these pre-session operations.
      properties:
        bindingCookie: { $ref: '#/components/schemas/WebEnrollmentNonce' }
    WebEnrollmentPendingRequest:
      type: object
      additionalProperties: false
      required: [transport, identifierProof]
      properties:
        transport: { type: string, const: web }
        identifierProof: { $ref: '#/components/schemas/WebEnrollmentIdentifierProof' }
    WebEnrollmentSimulatorRequest:
      type: object
      additionalProperties: false
      required: [transport, continuation]
      properties:
        transport: { type: string, const: web }
        continuation: { $ref: '#/components/schemas/WebEnrollmentContinuation' }
    WebEnrollmentCompleteRequest:
      type: object
      additionalProperties: false
      required: [transport, verifiedEnrollment]
      properties:
        transport: { type: string, const: web }
        verifiedEnrollment: { $ref: '#/components/schemas/WebVerifiedEnrollment' }
    WebEnrollmentPendingCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, cookies, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebEnrollmentHeaders' }
        cookies: { $ref: '#/components/schemas/WebEnrollmentCookies' }
        body: { $ref: '#/components/schemas/WebEnrollmentPendingRequest' }
    WebEnrollmentSimulatorCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, cookies, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebEnrollmentHeaders' }
        cookies: { $ref: '#/components/schemas/WebEnrollmentCookies' }
        body: { $ref: '#/components/schemas/WebEnrollmentSimulatorRequest' }
    WebEnrollmentCompleteCallEnvelope:
      type: object
      additionalProperties: false
      required: [transport, headers, cookies, body]
      properties:
        transport: { type: string, const: web }
        headers: { $ref: '#/components/schemas/WebEnrollmentHeaders' }
        cookies: { $ref: '#/components/schemas/WebEnrollmentCookies' }
        body: { $ref: '#/components/schemas/WebEnrollmentCompleteRequest' }
    WebEnrollmentPendingResponse:
      type: object
      additionalProperties: false
      required: [transport, continuation, status, nextBrowserNonce]
      properties:
        transport: { type: string, const: web }
        continuation: { $ref: '#/components/schemas/WebEnrollmentContinuation' }
        status: { type: string, const: pending }
        nextBrowserNonce: { $ref: '#/components/schemas/WebEnrollmentNonce' }
    WebEnrollmentSimulatorResponse:
      type: object
      additionalProperties: false
      required: [transport, verifiedEnrollment, status, nextBrowserNonce]
      properties:
        transport: { type: string, const: web }
        verifiedEnrollment: { $ref: '#/components/schemas/WebVerifiedEnrollment' }
        status: { type: string, const: verified }
        nextBrowserNonce: { $ref: '#/components/schemas/WebEnrollmentNonce' }
    WebEnrollmentProblem:
      description: >
        Exactly four masked fields, no PII/credential/provider/contact/driver
        details. Status/code pairs follow WebEnrollmentProblem response mapping.
      oneOf:
        - { $ref: '#/components/schemas/WebEnrollmentBadRequestProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentInvalidAuthorityProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentOriginProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentUnavailableProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentConflictProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentRateProblem' }
        - { $ref: '#/components/schemas/WebEnrollmentInternalProblem' }
    WebEnrollmentBadRequestProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 400 }
        code: { type: string, const: INVALID_ENROLLMENT_REQUEST }
    WebEnrollmentInvalidAuthorityProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 401 }
        code: { type: string, const: ENROLLMENT_AUTHORITY_INVALID }
    WebEnrollmentOriginProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 403 }
        code: { type: string, const: AUTH_ORIGIN_REJECTED }
    WebEnrollmentUnavailableProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 404 }
        code: { type: string, const: ENROLLMENT_UNAVAILABLE }
    WebEnrollmentConflictProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 409 }
        code: { type: string, enum: [AUTH_RESTART_REQUIRED, ENROLLMENT_LOGIN_REQUIRED] }
    WebEnrollmentRateProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 429 }
        code: { type: string, const: ENROLLMENT_RATE_LIMITED }
    WebEnrollmentInternalProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string, const: 'Authentication unavailable' }
        status: { type: integer, const: 500 }
        code: { type: string, const: INTERNAL_ERROR }
    SessionRequest:
      oneOf:
        - $ref: '#/components/schemas/WebSessionRequest'
        - $ref: '#/components/schemas/MobileSessionRequest'
      discriminator:
        propertyName: transport
        mapping: { web: '#/components/schemas/WebSessionRequest', mobile: '#/components/schemas/MobileSessionRequest' }
    WebSessionRequest:
      type: object
      additionalProperties: false
      required: [transport, loginProof]
      properties:
        transport: { type: string, const: web }
        loginProof: { type: string, description: "Server-issued one-use login proof bound to web transport." }
    MobileSessionRequest:
      type: object
      additionalProperties: false
      required: [transport, loginProof]
      properties:
        transport: { type: string, const: mobile }
        loginProof: { type: string, description: "Server-issued one-use login proof bound to mobile transport." }
        deviceName: { type: string, maxLength: 100 }
    WebSessionResponse:
      type: object
      additionalProperties: false
      required: [transport, sessionId, csrfToken]
      properties:
        transport: { type: string, const: web }
        sessionId: { type: string, format: uuid }
        csrfToken: { type: string, description: "Readable session-bound CSRF token, distinct from browser nonce." }
    MobileSessionResponse:
      type: object
      additionalProperties: false
      required: [transport, sessionId, accessToken, refreshToken]
      properties:
        transport: { type: string, const: mobile }
        sessionId: { type: string, format: uuid }
        accessToken: { type: string, description: "Short-lived v2 access JWT returned once for OS secure storage." }
        refreshToken: { type: string, description: "Opaque refresh credential returned once for OS secure storage." }
    WebRefreshResponse:
      type: object
      additionalProperties: false
      required: [transport, sessionId, csrfToken]
      properties:
        transport: { type: string, const: web }
        sessionId: { type: string, format: uuid }
        csrfToken: { type: string, description: "Rotated readable session-bound CSRF token." }
    MobileRefreshResponse:
      type: object
      additionalProperties: false
      required: [transport, sessionId, accessToken, refreshToken]
      properties:
        transport: { type: string, const: mobile }
        sessionId: { type: string, format: uuid }
        accessToken: { type: string, description: Short-lived v2 access JWT rotated within the same session family. }
        refreshToken: { type: string }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, createdAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }
        deviceName: { type: [string, 'null'] }
    DeleteOtpStartRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: { type: string, enum: [sms, email] }
    DeleteOtpStartResponse:
      type: object
      additionalProperties: false
      required: [challengeId, status]
      properties:
        challengeId: { type: string }
        status: { type: string, const: accepted }
    DeleteOtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string, minLength: 1 }
    DeleteOtpVerifyResponse:
      type: object
      additionalProperties: false
      required: [reauthProof]
      properties:
        reauthProof: { type: string, description: "Opaque one-use account-delete-only proof; store hash only." }
    DeleteMeRequest:
      type: object
      additionalProperties: false
      required: [reauthProof]
      properties:
        reauthProof: { type: string, description: "Independent same-principal account-delete proof; atomically consumed." }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [type, title, status]
    V2Problem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            code: { type: string, description: "Stable generic machine code; AUTH_RESTART_REQUIRED signals a new verification flow." }


  parameters:
    SubscriptionScope:
      name: scope
      in: query
      required: false
      description: Defaults to me. Household means rows currently visible through any of the caller's active households; no owner selector.
      schema: { type: string, enum: [me, household], default: me }
    SubscriptionStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/SubscriptionReadStatus' }
    SubscriptionCategoryFilter:
      name: category
      in: query
      required: false
      description: Exact stable code from CATEGORIES.md; unknown codes return generic 400, not an empty page.
      schema:
        type: string
        enum:
          - VIDEO_STREAMING
          - MUSIC_AUDIO
          - AUDIOBOOKS_EBOOKS
          - NEWS_MAGAZINES
          - GAMING
          - SOFTWARE_PRODUCTIVITY
          - CLOUD_STORAGE
          - AI_TOOLS
          - MOBILE_PLAN
          - BROADBAND_TV
          - FITNESS_WELLNESS
          - FOOD_MEALKITS
          - TRANSPORT_MOBILITY
          - HOME_SECURITY
          - EDUCATION_KIDS
          - PETS
          - SHOPPING_MEMBERSHIPS
          - VPN_SECURITY
          - DONATIONS
          - DATING_SOCIAL
          - APP_STORE_BILLING
          - OTHER_SUBSCRIPTION
    SubscriptionCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque base64url continuation, at most 512 characters and 384 decoded
        bytes. Decode only a versioned (endpoint,created_at,id,normalized
        scope/status/category filters) tuple; reject malformed, unknown-version,
        endpoint-mismatched or filter-mismatched cursors with 400
        INVALID_SUBSCRIPTION_QUERY. The tuple is a position, never authority;
        current RLS and filters must be applied before keyset pagination.
      schema: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    SubscriptionLimit:
      name: limit
      in: query
      required: false
      description: Default 20; valid integer range 1 through 50, with no clamping.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    WebEnrollmentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/WebEnrollmentKey' }
      description: Exactly one nonspace printable ASCII key; global burn retained at most24h, duplicates never replay.
    WebEnrollmentBrowserNonce:
      name: X-Browser-Nonce
      in: header
      required: true
      schema: { $ref: '#/components/schemas/WebEnrollmentNonce' }
      description: Exactly one public nonce matched to Origin/chain/binding cookie and operation purpose.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
      description: Required on every mutating POST; retries cannot replay secrets/proofs or bypass throttles.
    ExactOrigin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
      description: Must exactly match a configured allowlisted origin; null, wildcard and reflected credentialed origins are rejected.
    OriginForWeb:
      name: Origin
      in: header
      required: false
      schema: { type: string, format: uri }
      description: Required for web-cookie/browser transport; must exactly match configured allowlist. Mobile Bearer transport does not send browser Origin.
    BrowserNonce:
      name: X-Browser-Nonce
      in: header
      required: false
      schema: { type: string }
      description: >
        Required for web transport only: public nonce paired with the distinct HttpOnly browser binding cookie. Mobile omits it.
    SessionCsrf:
      name: X-Session-CSRF
      in: header
      required: false
      schema: { type: string }
      description: Required for web cookie unsafe calls; session-bound, separate from browser nonce. Bearer mobile does not use cookie CSRF.
  securitySchemes:
    V1AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Existing accepted JWT validated by AuthenticatedPrincipalGuard and current-session owner reader; no caller identity header or v2 credential fallback.
    V2WebAccessCookie:
      type: apiKey
      in: cookie
      name: st_v2_access
      description: Web access cookie; host-only Secure HttpOnly SameSite=Lax, Path=/v2. Reject alongside Authorization credentials.
    V2AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile access only; JWT with v2 issuer/audience/key namespace, no fallback to v1 identity headers.
    V2WebRefreshCookie:
      type: apiKey
      in: cookie
      name: st_v2_refresh
      description: Web refresh cookie; host-only Secure HttpOnly SameSite=Lax, Path=/v2/auth.
    V2MobileRefresh:
      type: apiKey
      in: header
      name: Authorization
      description: Mobile only, exact form `Refresh <opaque-secret>`; custom auth scheme, never body/query.
  responses:
    BrowserProfileView:
      description: Fresh persisted, owner-scoped closed profile view after successful current authority.
      headers:
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
        Pragma: { required: true, schema: { type: string, const: no-cache } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProfileView' }
    BrowserProfileProblem:
      description: >
        Exact status/code pairs: 400 INVALID_PROFILE_REQUEST for invalid request;
        401 AUTHENTICATION_REQUIRED for all collapsed current-authority failures;
        403 PROFILE_REQUEST_REJECTED only for syntactically rejected envelope;
        409 PROFILE_CONFLICT for safe state or uncertain outcome;
        500 INTERNAL_ERROR for masked failure outside authority.
      headers:
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
        Pragma: { required: true, schema: { type: string, const: no-cache } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BrowserProfileProblem' }
    BrowserSubscriptionLifecycleProblem:
      description: >
        Generic bounded error. Malformed path/body/target/query, transport, origin
        or header multiplicity is 400 INVALID_SUBSCRIPTION_LIFECYCLE_REQUEST;
        absent or invalid current access authority is 401 AUTHENTICATION_REQUIRED;
        invalid or missing session CSRF is 403 AUTH_CSRF_UNAVAILABLE; missing and
        foreign IDs share the identical 404 SUBSCRIPTION_NOT_FOUND; stale or
        disallowed pairs return 409 LIFECYCLE_CONFLICT; internal faults are
        masked as 500 INTERNAL_ERROR. Never disclose credentials or owner data.
      headers:
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BrowserSubscriptionLifecycleError' }
    BrowserSubscriptionReadProblem:
      description: >
        Generic bounded error. Malformed path/body/query, transport, origin or
        header multiplicity is 400 INVALID_SUBSCRIPTION_QUERY; absent or invalid
        current access authority is 401 AUTHENTICATION_REQUIRED; invalid or
        missing session CSRF is 403 AUTH_CSRF_UNAVAILABLE; missing and invisible
        IDs share the identical 404 SUBSCRIPTION_NOT_FOUND; internal faults are
        masked as 500 INTERNAL_ERROR. Never disclose credentials or owner data.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BrowserSubscriptionReadProblem' }
    SubscriptionLifecycleProblem:
      description: >
        Stable RFC 9457 error. Malformed UUID/body/target/query is 400; absent or
        invalid current principal is 401; missing and owner-invisible IDs return
        identical 404 SUBSCRIPTION_NOT_FOUND; stale/disallowed pairs return 409
        LIFECYCLE_CONFLICT; storage faults are masked as 500 INTERNAL_ERROR.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SubscriptionLifecycleError' }
    SubscriptionProblem:
      description: Stable, generic RFC 9457 subscription read error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SubscriptionReadProblem' }
    Problem:
      description: An error response following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    WebEnrollmentProblem:
      description: >
        Generic masked four-field error. 400 INVALID_ENROLLMENT_REQUEST for malformed
        request; 401 ENROLLMENT_AUTHORITY_INVALID for invalid proof/provider
        authority; 403 AUTH_ORIGIN_REJECTED for Origin/binding policy;
        404 ENROLLMENT_UNAVAILABLE when disabled; 409 AUTH_RESTART_REQUIRED for
        pending/expired/consumed/mismatch/conflict or duplicate, except verified
        registered active subject ENROLLMENT_LOGIN_REQUIRED on completion only;
        429 ENROLLMENT_RATE_LIMITED for capacity/throttle; 500 INTERNAL_ERROR
        for unavailable dependencies when independently trusted classification is
        available. The ST-237 qualified private development composition preserves
        the accepted durable core's masked 409 AUTH_RESTART_REQUIRED for collapsed
        invalid, spent, capacity, dependency and uncertain outcomes; it does not
        infer 401 or 429 from SQLSTATE, error text or a second query. Unexpected
        adapter or token-issuer faults outside that core return generic 500.
        No replay or credential Set-Cookie on error.
      headers:
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
        Pragma: { required: true, schema: { type: string, const: no-cache } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WebEnrollmentProblem' }
    V2Problem:
      description: Generic v2 error; duplicate or uncertain one-use POST returns 409 AUTH_RESTART_REQUIRED without credentials.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Pragma: { schema: { type: string, const: no-cache } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/V2Problem" }
