# Catalogue plan seed data — ~124 plans for the 62 merchants in merchants.yaml.
#
# Fields:
#   merchant_key  — matches CatalogMerchant.key (referenced at seed time → UUID FK).
#   name          — plan display name (≤ 120 chars).
#   period        — MONTHLY | ANNUAL | QUARTERLY | WEEKLY | IRREGULAR.
#   amount_minor  — amount in SEK öre; null = price varies / enterprise pricing.
#   currency      — ISO 4217 (default SEK).
#   region        — SE (Sweden), EU, GLOBAL. Default GLOBAL.
#   active        — boolean. Default true.
#
# All amounts are approximate Swedish market retail prices (2025/2026).

