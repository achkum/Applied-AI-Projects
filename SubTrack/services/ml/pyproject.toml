[project]
name = "subtrack-ml"
version = "0.1.0"
description = "Internal SubTrack machine-learning service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "scikit-learn>=1.5,<2.0",
    "numpy>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "joblib>=1.4,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
