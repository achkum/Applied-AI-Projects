services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtrack}
      POSTGRES_USER: ${POSTGRES_USER:-subtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    command:
      - /bin/sh
      - -ec
      - >-
        printf '%s' '{"apps":{"http":{"servers":{"dev":{"listen":[":80"],"routes":[{"handle":[{"handler":"static_response","body":"SubTrack local development stack"}]}]}}}}}' > /tmp/caddy.json;
        exec caddy run --config /tmp/caddy.json
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          # ARCHITECTURE.md §7 VPS resource budget (assume 4 GB RAM): ml 512 MB.
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
