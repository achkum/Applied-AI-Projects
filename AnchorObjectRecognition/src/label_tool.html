<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Label tool</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 16px; background: #1b1d20; color: #e8e8e8; }
  #bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  select, button { font: inherit; padding: 6px 10px; }
  #status { font-weight: 600; }
  .present { color: #5fd38a; } .absent { color: #ff7b7b; }
  canvas { display: block; cursor: crosshair; background: #000; }
  #help { margin-top: 10px; color: #aab; line-height: 1.6; }
  kbd { background: #333; padding: 1px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div id="bar">
  <label>Sequence <select id="seq"></select></label>
  <span id="pos"></span>
  <span id="status"></span>
  <span id="progress"></span>
</div>
<canvas id="cv"></canvas>
<div id="help">
  <kbd>Enter</kbd> accept this frame and go next &nbsp;
  <kbd>N</kbd> extinguisher NOT present &nbsp;
  <kbd>drag</kbd> draw a new box around the red body &nbsp;
  <kbd>←</kbd> <kbd>→</kbd> move &nbsp;
  <kbd>U</kbd> jump to the next unreviewed frame.<br>
  Box rule: the red body of the real extinguisher only (not the hose). Printed pictures of extinguishers are NOT the target.
</div>

<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const IMG_W = 640, IMG_H = 400;
const scale = Math.min(2, (window.innerWidth - 40) / IMG_W);   // draw the 640x400 frame bigger so small targets are visible
cv.width = IMG_W * scale; cv.height = IMG_H * scale;

let seq = "", frames = [], idx = 0, img = new Image(), drag = null;

// Fill the sequence menu from the server, then load the first one.
const sel = document.getElementById("seq");
["test", "eval"].forEach(s => sel.add(new Option(s, s)));
sel.onchange = () => load(sel.value);

async function load(s) {
  seq = s;
  try {
    frames = await (await fetch("/api/frames?seq=" + s)).json();
  } catch (e) {   // happens when the page was opened as a file instead of through the server
    document.getElementById("status").textContent = "Cannot reach the server. Run: python tools/label_server.py, then open http://localhost:8000";
    return;
  }
  idx = Math.max(0, frames.findIndex(f => !f.reviewed));
  show();
}

// Draw the current frame, its box and the status line.
function show() {
  const f = frames[idx];
  img.onload = draw;
  img.src = `/img/${seq}/${f.name}`;
  document.getElementById("pos").textContent = `Frame ${idx + 1} / ${frames.length}`;
  const st = document.getElementById("status");
  st.textContent = (f.present ? "PRESENT" : "ABSENT") + (f.reviewed ? " (reviewed)" : " (auto guess, not reviewed)");
  st.className = f.present ? "present" : "absent";
  const done = frames.filter(x => x.reviewed).length, pres = frames.filter(x => x.reviewed && x.present).length;
  document.getElementById("progress").textContent = `Reviewed ${done}/${frames.length} · present ${pres} · absent ${done - pres}`;
}
function draw() {
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const f = frames[idx];
  const b = drag || f.box;
  if (b) {
    ctx.strokeStyle = f.reviewed || drag ? "#5fd38a" : "#ffd24d";   // yellow = still an unchecked guess
    ctx.lineWidth = 2;
    ctx.strokeRect(b[0] * scale, b[1] * scale, (b[2] - b[0]) * scale, (b[3] - b[1]) * scale);
  }
}

// Save the current frame's label on the server and mark it reviewed.
async function save() {
  const f = frames[idx];
  f.reviewed = true;
  await fetch("/api/save?seq=" + seq, { method: "POST", body: JSON.stringify({ name: f.name, present: f.present, box: f.box }) });
}
function go(i) { idx = Math.min(frames.length - 1, Math.max(0, i)); show(); }

// Drawing a box with the mouse (image pixel coordinates).
const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
cv.onmousedown = e => { const p = pt(e); drag = [...p, ...p]; };
cv.onmousemove = e => { if (drag) { const p = pt(e); drag[2] = p[0]; drag[3] = p[1]; draw(); } };
cv.onmouseup = async () => {
  if (!drag) return;
  const [x1, y1, x2, y2] = drag, f = frames[idx];
  drag = null;
  if (Math.abs(x2 - x1) > 3 && Math.abs(y2 - y1) > 3) {   // ignore accidental clicks
    f.box = [x1, y1, x2, y2].map(Math.round); f.box = [Math.min(f.box[0], f.box[2]), Math.min(f.box[1], f.box[3]), Math.max(f.box[0], f.box[2]), Math.max(f.box[1], f.box[3])];
    f.present = true;
    await save();
  }
  show();
};

// Keyboard shortcuts.
document.onkeydown = async e => {
  if (e.key === "Enter") { await save(); go(idx + 1); }
  else if (e.key === "n" || e.key === "N") { const f = frames[idx]; f.present = false; f.box = null; await save(); go(idx + 1); }
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "u" || e.key === "U") {   // next unreviewed frame; wraps to the start if none is left ahead
    let j = frames.findIndex((f, i) => i > idx && !f.reviewed);
    if (j < 0) j = frames.findIndex(f => !f.reviewed);
    go(j < 0 ? idx : j);
  }
};

load("test");
</script>
</body>
</html>
