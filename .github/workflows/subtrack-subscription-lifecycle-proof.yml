name: SubTrack subscription lifecycle PostgreSQL proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SubTrack/apps/api/src/subscriptions/subscription-lifecycle.repository.ts"
      - "SubTrack/apps/api/src/subscriptions/subscription-lifecycle.repository.spec.ts"
      - "SubTrack/apps/api/test/subscription-lifecycle-storage.integration.ts"
      - "SubTrack/apps/api/vitest.subscription-lifecycle.config.ts"
      - "SubTrack/tools/database/subscription-lifecycle-proof.sh"
      - ".github/workflows/subtrack-subscription-lifecycle-proof.yml"
permissions:
  contents: read
jobs:
  disposable-storage-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Owned PostgreSQL 16 lifecycle storage proof
        run: bash tools/database/subscription-lifecycle-proof.sh
      - name: Cleanup only recorded ST-081c container
        if: always()
        run: bash tools/database/subscription-lifecycle-proof.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st081c-subscription-lifecycle-proof-${{ github.sha }}
          path: ${{ runner.temp }}/st081c-proof-receipt.txt
          if-no-files-found: ignore
          retention-days: 7
