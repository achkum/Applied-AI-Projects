name: SubTrack CI

on:
  pull_request:
    paths:
      - "SubTrack/**"

permissions:
  contents: read

jobs:
  compose-runtime-proof:
    name: ST-004 Compose runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SubTrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack through Make target
        run: make up

      - name: Assert all services are healthy
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps --format json | tee "$RUNNER_TEMP/compose-ps.jsonl"
          node - <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync(process.env.RUNNER_TEMP + '/compose-ps.jsonl', 'utf8').trim();
          let parsed;
          try { parsed = JSON.parse(output); }
          catch { parsed = output.split('\n').map(line => JSON.parse(line)); }
          const containers = Array.isArray(parsed) ? parsed : [parsed];
          const expected = new Set(['postgres', 'redis', 'mailpit', 'caddy']);
          for (const container of containers) {
            const service = container.Service || container.Name;
            if (expected.has(service)) {
              const health = String(container.Health || container.Status || '').toLowerCase();
              if (!health.includes('healthy')) throw new Error(`${service} is not healthy: ${health}`);
              expected.delete(service);
            }
          }
          if (expected.size) throw new Error(`Missing services: ${[...expected].join(', ')}`);
          console.log('All four required Compose services report healthy.');
          NODE

      - name: Verify followed logs emit stack output
        shell: bash
        run: |
          set +e
          timeout --signal=INT 8s make logs > "$RUNNER_TEMP/compose-logs.txt" 2>&1
          status=$?
          set -e
          if [[ $status -ne 124 && $status -ne 130 ]]; then
            cat "$RUNNER_TEMP/compose-logs.txt"
            echo "Expected timeout to stop followed logs, got exit $status" >&2
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/compose-logs.txt" ]]; then
            echo 'make logs produced no output' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/compose-logs.txt"

      - name: Verify down retains named volumes
        shell: bash
        run: |
          set -euo pipefail
          project=$(docker compose config --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).name))")
          make down
          for volume in postgres-data redis-data; do
            docker volume inspect "${project}_${volume}" >/dev/null
            echo "Retained named volume: ${project}_${volume}"
          done

      - name: Clean up containers without deleting volumes
        if: always()
        run: make down

  quality-gates:
    name: SubTrack quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SubTrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: SubTrack/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: i18n catalog parity
        shell: bash
        run: |
          if [[ -f packages/i18n/scripts/check-parity.mjs ]]; then
            node packages/i18n/scripts/check-parity.mjs
          else
            echo 'i18n parity checker is not present yet; it will run automatically when the catalog implementation is included.'
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: License check
        shell: bash
        run: |
          pnpm licenses list --json > "$RUNNER_TEMP/subtrack-licenses.json"
          node <<'NODE'
          const fs = require('node:fs');
          const allowed = new Set([
            'MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', '0BSD',
            'CC0-1.0', 'Unlicense', 'BlueOak-1.0.0', 'Python-2.0', 'MIT-0',
            'MPL-2.0', 'LGPL-3.0-or-later', 'CC-BY-4.0', 'Apache-2.0 AND MIT',
          ]);

          function check(graph) {
            if (!graph || typeof graph !== 'object' || Array.isArray(graph) || !Object.keys(graph).length) {
              return { errors: ['license graph is empty or malformed'], packages: 0 };
            }
            const errors = [];
            let count = 0;
            for (const [license, entries] of Object.entries(graph)) {
              if (!Array.isArray(entries) || entries.length === 0) {
                errors.push(`${license}: missing package entries`);
                continue;
              }
              for (const entry of entries) {
                count++;
                if (!entry || typeof entry.name !== 'string' || !Array.isArray(entry.versions) || !entry.versions.length || entry.license !== license) {
                  errors.push(`${license}: malformed package entry`);
                  continue;
                }
                if (!allowed.has(license)) errors.push(`${entry.name}@${entry.versions.join(',')}: disallowed license ${license}`);
              }
            }
            if (!count) errors.push('license graph contains no packages');
            return { errors, packages: count };
          }

          const negative = check({ 'GPL-3.0-only': [{ name: 'gate-negative-case', versions: ['0'], license: 'GPL-3.0-only' }] });
          if (!negative.errors.some(error => error.includes('disallowed license GPL-3.0-only'))) {
            console.error('License checker negative-case self-test failed: disallowed license was not rejected');
            process.exit(1);
          }
          console.log('License checker negative-case self-test passed (GPL-3.0-only rejected).');

          let graph;
          try {
            graph = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/subtrack-licenses.json', 'utf8'));
          } catch (error) {
            console.error(`License inventory JSON is unreadable: ${error.message}`);
            process.exit(1);
          }
          const result = check(graph);
          if (result.errors.length) {
            for (const error of result.errors) console.error(`License check failed: ${error}`);
            process.exit(1);
          }
          console.log(`License check passed: ${result.packages} resolved packages; allowed SPDX identifiers: ${[...new Set(Object.keys(graph))].sort().join(', ')}.`);
          NODE
