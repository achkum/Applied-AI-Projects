name: SubTrack CI

on:
  pull_request:
    paths:
      - "SubTrack/**"
      - ".github/workflows/subtrack-ci.yml"

permissions:
  contents: read

jobs:
  compose-runtime-proof:
    name: ST-004 Compose runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    defaults:
      run:
        working-directory: SubTrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public registry mirror availability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://docs.aws.amazon.com/AmazonECR/latest/public/public-registries.html \
            --output "$RUNNER_TEMP/ecr-public-registries.html"
          test -s "$RUNNER_TEMP/ecr-public-registries.html"
          echo 'Fetched official Amazon ECR Public registry documentation.'
          images=(
            public.ecr.aws/docker/library/postgres:16-alpine
            public.ecr.aws/docker/library/redis:7-alpine
            ghcr.io/axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
            public.ecr.aws/docker/library/caddy:2-alpine
            public.ecr.aws/docker/library/python:3.12-slim
          )
          for image in "${images[@]}"; do
            echo "Inspecting $image"
            docker manifest inspect --verbose "$image" | tee "$RUNNER_TEMP/manifest.json"
            node - "$RUNNER_TEMP/manifest.json" "$image" <<'NODE'
          const fs = require('node:fs');
          const [path, image] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entries = Array.isArray(manifest) ? manifest : [manifest];
          const digests = [...new Set(entries.map(entry => entry?.Descriptor?.digest || entry?.descriptor?.digest).filter(Boolean))];
          if (!digests.length) throw new Error(`No registry digest reported for ${image}`);
          console.log(`${image} registry digest(s): ${digests.join(', ')}`);
          NODE
          done

      - name: Start stack through Make target
        run: make up

      - name: Assert all services are healthy
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps --format json | tee "$RUNNER_TEMP/compose-ps.jsonl"
          node - <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync(process.env.RUNNER_TEMP + '/compose-ps.jsonl', 'utf8').trim();
          let parsed;
          try { parsed = JSON.parse(output); }
          catch { parsed = output.split('\n').map(line => JSON.parse(line)); }
          const containers = Array.isArray(parsed) ? parsed : [parsed];
          const expected = new Set(['postgres', 'redis', 'mailpit', 'caddy', 'ml']);
          for (const container of containers) {
            const service = container.Service || container.Name;
            if (expected.has(service)) {
              const health = String(container.Health || container.Status || '').toLowerCase();
              if (!health.includes('healthy')) throw new Error(`${service} is not healthy: ${health}`);
              expected.delete(service);
            }
          }
          if (expected.size) throw new Error(`Missing services: ${[...expected].join(', ')}`);
          console.log('All five required Compose services report healthy.');
          NODE

      - name: Verify followed logs emit stack output
        shell: bash
        run: |
          set +e
          timeout --signal=INT 8s make logs > "$RUNNER_TEMP/compose-logs.txt" 2>&1
          status=$?
          set -e
          if [[ $status -ne 124 && $status -ne 130 ]]; then
            cat "$RUNNER_TEMP/compose-logs.txt"
            echo "Expected timeout to stop followed logs, got exit $status" >&2
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/compose-logs.txt" ]]; then
            echo 'make logs produced no output' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/compose-logs.txt"

      - name: Verify down retains named volumes
        shell: bash
        run: |
          set -euo pipefail
          project=$(docker compose config --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).name))")
          make down
          for volume in postgres-data redis-data; do
            docker volume inspect "${project}_${volume}" >/dev/null
            echo "Retained named volume: ${project}_${volume}"
          done

      - name: Clean up containers without deleting volumes
        if: always()
        run: make down

  quality-gates:
    name: SubTrack quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SubTrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: SubTrack/pnpm-lock.yaml

      - name: Test maintenance workflow helpers
        run: |
          python3 -m unittest discover -s tools/workflow -p 'test_*.py' -v
          node --test tools/workflow/qa-common.test.cjs

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ST-017: Token contrast check (ST-020 script). Guard lets CI pass before
      # ST-020 tokens land; once the script exists it is a hard gate (exit 1 on failure).
      # Docs: packages/ui-tokens/scripts/check-contrast.mjs (WCAG AA, OKLCH pairs)
      - name: Token contrast check (ST-020)
        shell: bash
        run: |
          if [[ -f packages/ui-tokens/scripts/check-contrast.mjs ]]; then
            node packages/ui-tokens/scripts/check-contrast.mjs
          else
            echo 'contrast checker not present; will run when ST-020 tokens are built'
          fi

      - name: Tests
        run: pnpm test

      # ST-017: Storybook visual regression (ST-022). Builds static Storybook, serves it,
      # then runs @storybook/test-runner (Playwright + jest-image-snapshot, 1 % threshold).
      # Baseline snapshots live in packages/ui/.storybook/__snapshots__; first run creates
      # them (non-failing). Reference: https://storybook.js.org/docs/writing-tests/test-runner
      # (accessed 2026-10-01).
      - name: Install Playwright browsers (Storybook visual regression)
        shell: bash
        run: pnpm --filter @subtrack/ui exec playwright install chromium --with-deps

      - name: Visual regression — Storybook (ST-022)
        shell: bash
        run: |
          pnpm --filter @subtrack/ui run storybook:build --quiet
          npx http-server packages/ui/storybook-static --port 6006 --silent &
          SERVER_PID=$!
          npx wait-on tcp:6006 --timeout 60000
          pnpm --filter @subtrack/ui run storybook:test
          kill "$SERVER_PID" || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: SubTrack/services/ml/uv.lock

      - name: Install locked ML dependencies
        working-directory: SubTrack/services/ml
        run: uv sync --locked

      - name: Test ML endpoints
        working-directory: SubTrack/services/ml
        run: uv run --locked pytest

      - name: i18n catalog parity
        shell: bash
        run: |
          if [[ -f packages/i18n/scripts/check-parity.mjs ]]; then
            node packages/i18n/scripts/check-parity.mjs
          else
            echo 'i18n parity checker is not present yet; it will run automatically when the catalog implementation is included.'
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: License check
        shell: bash
        run: |
          pnpm licenses list --json > "$RUNNER_TEMP/subtrack-licenses.json"
          node <<'NODE'
          const fs = require('node:fs');
          const allowed = new Set([
            'MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', '0BSD',
            'CC0-1.0', 'Unlicense', 'BlueOak-1.0.0', 'Python-2.0', 'MIT-0',
            // D-11 (2026-09-29, decisions.md): founder-approved additions.
            'LGPL-3.0-or-later', 'MPL-2.0', 'CC-BY-4.0', 'Unicode-DFS-2016',
          ]);

          // Non-SPDX-normalized license strings seen in `pnpm licenses list`
          // output that map unambiguously onto an already-allowed SPDX id.
          const aliases = new Map([
            ['Apache 2.0', 'Apache-2.0'],
          ]);

          // Package-specific exceptions: narrow, per-package overrides for
          // cases where the declared license string can't be generically
          // allowlisted (e.g. "Unknown") but the specific package/version was
          // individually reviewed and approved. Never add a blanket allowance
          // for a whole license string here (e.g. "Unknown") — that would
          // silently defeat the gate for every future package with an
          // undetectable license.
          const packageExceptions = new Map([
            // D-11 (2026-09-29, decisions.md): founder-approved exception for
            // this specific package's "Unknown" license field, not a blanket
            // "Unknown" allowance.
            ['valid-url@1.0.9', 'D-11 founder-approved exception for this specific package (license field is "Unknown" upstream)'],
            // package.json declares "BSD" (no clause), but the upstream
            // GitHub repository's LICENSE file is actually Apache-2.0 (an
            // already-allowed license) — the declared metadata is stale/wrong
            // relative to the verified upstream license text.
            ['readline@1.3.0', 'declared package.json license ("BSD") conflicts with verified upstream Apache-2.0 LICENSE file; treated as Apache-2.0'],
          ]);

          function isAllowedId(id) {
            const trimmed = id.trim();
            return allowed.has(aliases.get(trimmed) || trimmed);
          }

          // Evaluates a single SPDX id, or a simple compound `A AND B` / `A OR B`
          // expression (with optional enclosing parentheses), against the
          // allowlist. `AND` requires every component to be allowed; `OR`
          // (dual-licensing) requires at least one component to be allowed.
          function isAllowedExpression(license) {
            let expr = license.trim();
            if (expr.startsWith('(') && expr.endsWith(')')) expr = expr.slice(1, -1).trim();
            if (expr.includes(' AND ')) return expr.split(' AND ').every(isAllowedId);
            if (expr.includes(' OR ')) return expr.split(' OR ').some(isAllowedId);
            return isAllowedId(expr);
          }

          function check(graph) {
            if (!graph || typeof graph !== 'object' || Array.isArray(graph) || !Object.keys(graph).length) {
              return { errors: ['license graph is empty or malformed'], packages: 0 };
            }
            const errors = [];
            let count = 0;
            for (const [license, entries] of Object.entries(graph)) {
              if (!Array.isArray(entries) || entries.length === 0) {
                errors.push(`${license}: missing package entries`);
                continue;
              }
              for (const entry of entries) {
                count++;
                if (!entry || typeof entry.name !== 'string' || !Array.isArray(entry.versions) || !entry.versions.length || entry.license !== license) {
                  errors.push(`${license}: malformed package entry`);
                  continue;
                }
                const exceptionKey = `${entry.name}@${entry.versions.join(',')}`;
                if (packageExceptions.has(exceptionKey)) {
                  // Approved per-package exception (see packageExceptions above);
                  // skip the generic license-string checks for this entry.
                } else if (license === 'BSD') {
                  // Bare "BSD" doesn't identify BSD-2-Clause vs BSD-3-Clause, and
                  // isn't itself an approved exception, so it stays blocked
                  // pending manual confirmation.
                  errors.push(`${entry.name}@${entry.versions.join(',')}: ambiguous license BSD (package.json declares "BSD" with no clause qualifier; upstream repository LICENSE file is inconsistent with that declaration) — needs manual confirmation, not auto-normalized`);
                } else if (!isAllowedExpression(license)) {
                  errors.push(`${entry.name}@${entry.versions.join(',')}: disallowed license ${license}`);
                }
              }
            }
            if (!count) errors.push('license graph contains no packages');
            return { errors, packages: count };
          }

          const negative = check({ 'GPL-3.0-only': [{ name: 'gate-negative-case', versions: ['0'], license: 'GPL-3.0-only' }] });
          if (!negative.errors.some(error => error.includes('disallowed license GPL-3.0-only'))) {
            console.error('License checker negative-case self-test failed: disallowed license was not rejected');
            process.exit(1);
          }
          console.log('License checker negative-case self-test passed (GPL-3.0-only rejected).');

          let graph;
          try {
            graph = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/subtrack-licenses.json', 'utf8'));
          } catch (error) {
            console.error(`License inventory JSON is unreadable: ${error.message}`);
            process.exit(1);
          }
          const result = check(graph);
          if (result.errors.length) {
            for (const error of result.errors) console.error(`License check failed: ${error}`);
            process.exit(1);
          }
          console.log(`License check passed: ${result.packages} resolved packages; allowed SPDX identifiers: ${[...new Set(Object.keys(graph))].sort().join(', ')}.`);
          NODE
