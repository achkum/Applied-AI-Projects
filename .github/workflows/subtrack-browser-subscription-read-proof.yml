name: SubTrack owned browser subscription read proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SubTrack/package.json'
      - 'SubTrack/pnpm-lock.yaml'
      - 'SubTrack/pnpm-workspace.yaml'
      - 'SubTrack/apps/api/package.json'
      - 'SubTrack/apps/api/tsconfig*.json'
      - 'SubTrack/packages/ui/package.json'
      - 'SubTrack/packages/config/**'
      - 'SubTrack/packages/contracts/**'
      - 'SubTrack/packages/domain/**'
      - 'SubTrack/apps/api/src/subscriptions/**'
      - 'SubTrack/apps/api/src/auth/**'
      - 'SubTrack/apps/api/src/database/**'
      - 'SubTrack/apps/api/prisma/**'
      - 'SubTrack/apps/api/test/browser-subscription-read.integration.ts'
      - 'SubTrack/apps/api/vitest.browser-subscription-read.config.ts'
      - 'SubTrack/tools/database/browser-subscription-read-proof.sh'
      - 'SubTrack/.sdlc/evidence/ST-222/cleanup-negative-check.sh'
      - '.github/workflows/subtrack-browser-subscription-read-proof.yml'
permissions:
  contents: read
jobs:
  owned-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Missing ownership record denies proof PASS
        run: bash .sdlc/evidence/ST-222/cleanup-negative-check.sh
      - run: pnpm --filter @subtrack/ui exec playwright install chromium --with-deps
      - name: Owned PG16, compiled Node and Chromium proof
        run: bash tools/database/browser-subscription-read-proof.sh
      - name: Cleanup exact recorded container
        if: always()
        run: bash tools/database/browser-subscription-read-proof.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st222-browser-read-${{ github.sha }}
          path: ${{ runner.temp }}/st222-proof-receipt.txt
          if-no-files-found: error
          retention-days: 7
