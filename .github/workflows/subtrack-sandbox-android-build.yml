name: SubTrack sandbox unsigned Android Release build
on:
  workflow_call:
    inputs:
      runtime_enabled:
        type: boolean
        default: false
      version_code:
        type: string
        default: ""
      delivery_mode:
        type: string
        default: none
      source_head:
        type: string
        default: ""
      free_draft_confirmed:
        type: boolean
        default: false
      unsigned_transfer_receipt:
        type: string
        default: ""
      signed_return_release_id:
        type: string
        default: ""
      signer_certificate_sha256:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      runtime_enabled:
        type: boolean
        default: false
      version_code:
        type: string
        default: ""
      delivery_mode:
        type: choice
        options: [none, unsigned-apk, signing-tools, verify-signed]
        default: none
      source_head:
        type: string
        default: ""
      free_draft_confirmed:
        type: boolean
        default: false
      unsigned_transfer_receipt:
        type: string
        default: ""
      signed_return_release_id:
        type: string
        default: ""
      signer_certificate_sha256:
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/subtrack-sandbox-android-build.yml
      - SubTrack/tools/sandbox/build-android.sh
      - SubTrack/tools/sandbox/android-release-receipt*
      - SubTrack/apps/mobile/**
      - SubTrack/packages/**
      - SubTrack/package.json
      - SubTrack/pnpm-lock.yaml
      - SubTrack/pnpm-workspace.yaml
      - SubTrack/.npmrc
      - SubTrack/tsconfig.base.json
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode != 'none' && format('subtrack-sandbox-android-custody-{0}-{1}', github.run_id, github.run_attempt) || format('subtrack-sandbox-android-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.delivery_mode != 'none') }}
jobs:
  unsigned-android:
    if: github.event_name == 'pull_request' || inputs.delivery_mode == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: SubTrack
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      SUBTRACK_APP_VARIANT: sandbox
      SUBTRACK_SANDBOX_RUNTIME_ENABLED: ${{ inputs.runtime_enabled && 'true' || 'false' }}
      SUBTRACK_SANDBOX_VERSION_CODE: ${{ inputs.version_code }}
      SUBTRACK_SANDBOX_HTTPS_ORIGIN: https://198.44.116.159
      ST250_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Pinned frozen dependencies
        run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
          pnpm install --frozen-lockfile
      - name: Exact Android SDK tools
        run: |
          test -x "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platforms;android-36' 'ndk;27.1.12297006'
      - name: Actual locked-template and receipt policy
        run: node --test tools/sandbox/android-release-receipt.test.mjs
      - name: Actual unsigned Release APK and closed cleanup receipt
        run: bash tools/sandbox/build-android.sh unsigned-release
      # No APK/log/key uploads until included storage and authenticated transfer gates pass.
  private-delivery:
    if: github.event_name == 'workflow_dispatch' && (inputs.delivery_mode == 'unsigned-apk' || inputs.delivery_mode == 'signing-tools')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: SubTrack
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      SUBTRACK_APP_VARIANT: sandbox
      SUBTRACK_SANDBOX_RUNTIME_ENABLED: ${{ inputs.runtime_enabled && 'true' || 'false' }}
      SUBTRACK_SANDBOX_VERSION_CODE: ${{ inputs.version_code }}
      SUBTRACK_SANDBOX_HTTPS_ORIGIN: https://198.44.116.159
      ST250_SOURCE_HEAD: ${{ inputs.source_head }}
      ST250_FREE_DRAFT_CONFIRMED: ${{ inputs.free_draft_confirmed }}
      ST250_DELIVERY_MODE: ${{ inputs.delivery_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact reviewed manual source authority
        run: |
          test "$GITHUB_REPOSITORY" = achkum/Applied-AI-Projects
          test "$GITHUB_REF" = refs/heads/st/native-synthetic-bank
          test "$ST250_SOURCE_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$ST250_SOURCE_HEAD"
          test "$ST250_FREE_DRAFT_CONFIRMED" = true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Pinned APK dependencies
        if: inputs.delivery_mode == 'unsigned-apk'
        run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = 12.6.0
          pnpm install --frozen-lockfile
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platforms;android-36' 'ndk;27.1.12297006'
      - name: Focused Android custody contracts
        run: node --test tools/sandbox/android-release-receipt.test.mjs tools/sandbox/android-transfer-receipt.test.mjs
      - name: Free private draft custody and observed cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$ST250_DELIVERY_MODE" in
            unsigned-apk) bash tools/sandbox/draft-android.sh apk;;
            signing-tools) bash tools/sandbox/draft-android.sh tools;;
            *) exit 2;;
          esac
  signed-return-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'verify-signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: SubTrack
    env:
      CI: "true"
      SUBTRACK_APP_VARIANT: sandbox
      SUBTRACK_SANDBOX_RUNTIME_ENABLED: ${{ inputs.runtime_enabled && 'true' || 'false' }}
      SUBTRACK_SANDBOX_VERSION_CODE: ${{ inputs.version_code }}
      SUBTRACK_SANDBOX_HTTPS_ORIGIN: https://198.44.116.159
      ST250_SOURCE_HEAD: ${{ inputs.source_head }}
      ST250_DELIVERY_MODE: ${{ inputs.delivery_mode }}
      ST250_UNSIGNED_TRANSFER_RECEIPT: ${{ inputs.unsigned_transfer_receipt }}
      ST250_SIGNED_RETURN_RELEASE_ID: ${{ inputs.signed_return_release_id }}
      ST250_SIGNER_CERTIFICATE_SHA256: ${{ inputs.signer_certificate_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Standard Android manifest and binary tools
        run: |
          test "$GITHUB_REPOSITORY" = achkum/Applied-AI-Projects
          test "$GITHUB_REF" = refs/heads/st/native-synthetic-bank
          test "$ST250_SOURCE_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$ST250_SOURCE_HEAD"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Actual signed manifest Hermes certificate and cleanup receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/sandbox/build-android.sh verify-signed
