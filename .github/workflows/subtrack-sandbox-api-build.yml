name: SubTrack sandbox API image preparation

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Reviewed exact source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subtrack-sandbox-api-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false
      - name: Build and inspect isolated image
        shell: bash
        env:
          SANDBOX_SOURCE_HEAD: ${{ inputs.source_head }}
          SANDBOX_BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SANDBOX_BUILD_RECEIPT: ${{ runner.temp }}/st250-api-image.json
        run: bash SubTrack/tools/sandbox/build-api.sh
      - name: Upload closed preparation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st250-api-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/st250-api-image.json
          if-no-files-found: error
          retention-days: 2
