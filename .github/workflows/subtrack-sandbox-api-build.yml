name: SubTrack sandbox API image preparation

on:
  pull_request:
    paths:
      - 'SubTrack/apps/api/**'
      - 'SubTrack/packages/**'
      - 'SubTrack/infra/sandbox/Dockerfile.api'
      - 'SubTrack/pnpm-lock.yaml'
      - 'SubTrack/tools/sandbox/build-api.sh'
      - '.github/workflows/subtrack-sandbox-api-build.yml'
  workflow_dispatch:
    inputs:
      source_head:
        description: Reviewed exact source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subtrack-sandbox-api-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-image-policy:
    name: API image configuration and migration policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Check image configuration without a duplicate image build
        working-directory: SubTrack
        shell: bash
        run: |
          bash -n tools/sandbox/build-api.sh
          node --test tools/sandbox/bootstrap.test.cjs tools/database/sandbox-qualification-receipt.test.cjs
      # The same-image PostgreSQL workflow compiles and exercises the actual image.
      # This policy job does not claim an image build or upload a build receipt.
  image-preparation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_head }}
          persist-credentials: false
      - name: Build and inspect isolated image
        shell: bash
        env:
          SANDBOX_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || inputs.source_head }}
          SANDBOX_BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SANDBOX_BUILD_RECEIPT: ${{ runner.temp }}/st250-api-image.json
        run: bash SubTrack/tools/sandbox/build-api.sh
      - name: Upload closed preparation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st250-api-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/st250-api-image.json
          if-no-files-found: error
          retention-days: 2
