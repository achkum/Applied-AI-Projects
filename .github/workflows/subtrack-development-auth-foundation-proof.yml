name: SubTrack development auth foundation and atomic nonce issue proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SubTrack/apps/api/prisma/**'
      - 'SubTrack/apps/api/package.json'
      - 'SubTrack/pnpm-lock.yaml'
      - 'SubTrack/docs/architecture/adr/0031-isolated-node-postgres-driver-fixture.md'
      - 'SubTrack/tools/database/*development-auth-foundation-proof.sh'
      - '.github/workflows/subtrack-development-auth-foundation-proof.yml'
permissions:
  contents: read
jobs:
  owned-pg16-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked private driver proof dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Actual custody and bounded client lifecycle negatives
        run: bash tools/database/test-development-auth-foundation-proof.sh
      - name: Actual owned PG16 SCRAM foundation, nonce, reservation and atomic issue proof
        run: bash tools/database/development-auth-foundation-proof.sh
      - name: Remove exact recorded fixture
        if: always()
        run: bash tools/database/development-auth-foundation-proof.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st233a-foundation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/st233a-proof-receipt.txt
          if-no-files-found: error
          retention-days: 7
