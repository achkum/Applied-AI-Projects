name: SubTrack persistent sandbox PostgreSQL qualification
on:
  pull_request:
    paths:
      - 'SubTrack/apps/api/**'
      - 'SubTrack/packages/**'
      - 'SubTrack/pnpm-lock.yaml'
      - 'SubTrack/tools/database/sandbox-*'
      - '.github/workflows/subtrack-sandbox-postgresql-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-persistent-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install pinned native pnpm distribution
        run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Compile actual persistent sandbox entrypoint
        run: |
          pnpm --filter @subtrack/domain build:lifecycle
          pnpm --filter @subtrack/domain build:bank
          pnpm --filter @subtrack/domain build:detection
          pnpm --filter @subtrack/synthetic build:bank
          DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build pnpm --filter @subtrack/api exec prisma generate --schema=prisma/schema.prisma
          pnpm --filter @subtrack/api exec tsc -p tsconfig.build.json
          test -f apps/api/dist/sandbox/main.js
      - name: Qualify owned PostgreSQL and real HTTP entrypoint
        env:
          ST250_DISPOSABLE: hosted-owned-pg16
        run: bash tools/database/sandbox-qualify.sh
      - name: Publish only closed receipt after verified custody removal
        uses: actions/upload-artifact@v4
        with:
          name: st250-sandbox-postgresql-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/st250-sandbox-postgresql-receipt.json
          if-no-files-found: error
          retention-days: 14
