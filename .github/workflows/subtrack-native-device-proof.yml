name: SubTrack installed native device proof
on:
  pull_request:
    paths:
      - "SubTrack/apps/mobile/**"
      - "SubTrack/apps/api/**"
      - "SubTrack/packages/contracts/**"
      - "SubTrack/packages/i18n/**"
      - "SubTrack/tools/database/private-mobile*"
      - ".github/workflows/subtrack-native-device-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subtrack-native-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-native:
    name: Installed ${{ matrix.platform }} restart readback
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            database_mode: docker
          - platform: ios
            runner: macos-14
            database_mode: local
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: SubTrack
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      SUBTRACK_PRIVATE_DEVICE_PROOF: "true"
      EXPO_PUBLIC_MOBILE_ENROLLMENT_ENABLED: "true"
      EXPO_PUBLIC_MOBILE_ENROLLMENT_HTTPS_URL: https://localhost:3443
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Locked dependencies and proof tools
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          bash apps/mobile/scripts/private-runtime-tools.sh
          node apps/mobile/scripts/private-runtime-ca-test.mjs
          bash tools/database/private-mobile-descriptor.spec.sh
      - name: Android pinned emulator provisioning
        if: matrix.platform == 'android'
        run: bash apps/mobile/scripts/private-runtime-emulator.sh
      - name: Android SDK package installation (bounded)
        if: matrix.platform == 'android'
        run: |
          bash apps/mobile/scripts/private-runtime-android.sh sdk
      - name: Android startup orchestration checks
        if: matrix.platform == 'android'
        run: node apps/mobile/scripts/private-runtime-android-test.mjs
      - name: Android AVD creation (bounded)
        if: matrix.platform == 'android'
        run: bash apps/mobile/scripts/private-runtime-android.sh avd
      - name: Android emulator boot (bounded, loopback only)
        if: matrix.platform == 'android'
        run: |
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          bash apps/mobile/scripts/private-runtime-android.sh boot
      - name: iOS 17.5 / Xcode 15.4 simulator (Expo SDK51)
        if: matrix.platform == 'ios'
        run: |
          test -d /Applications/Xcode_15.4.app
          sudo xcode-select --switch /Applications/Xcode_15.4.app
          test "$(xcodebuild -version | head -1)" = 'Xcode 15.4'
          proof_udid="$(xcrun simctl create SubTrack-proof com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-17-5)"
          xcrun simctl boot "$proof_udid"
          xcrun simctl bootstatus "$proof_udid" -b
          printf 'SUBTRACK_SIMULATOR_UDID=%s\n' "$proof_udid" >> "$GITHUB_ENV"
          brew install postgresql@16
          printf '%s\n' "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
      - name: Owned PostgreSQL16 and ephemeral TLS fixture
        run: |
          fixture_ready="$(bash tools/database/private-mobile-proof.sh start --mode '${{ matrix.database_mode }}')"
          case "$fixture_ready" in ST244_FIXTURE_READY\ config=/*) ;; *) exit 1 ;; esac
          config_path="${fixture_ready#ST244_FIXTURE_READY config=}"
          printf 'SUBTRACK_PRIVATE_FIXTURE_CONFIG=%s\n' "$config_path" >> "$GITHUB_ENV"
      - name: Installed workflow, API restart, same database row and logout
        env:
          NODE_ENV: development
        run: node apps/mobile/scripts/private-runtime-device.mjs '${{ matrix.platform }}'
      - name: Sanitized native evidence only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st244-installed-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/subtrack-native-proof/public/
          if-no-files-found: error
          retention-days: 7
      - name: Owned fixture and debug server cleanup
        if: always()
        run: |
          if [[ '${{ matrix.platform }}' == android ]]; then
            bash apps/mobile/scripts/private-runtime-android.sh cleanup
          fi
          if [[ -n "${SUBTRACK_PRIVATE_FIXTURE_CONFIG:-}" ]]; then
            bash tools/database/private-mobile-proof.sh stop --config "$SUBTRACK_PRIVATE_FIXTURE_CONFIG"
          fi
          if [[ -f "$RUNNER_TEMP/subtrack-native-proof/private/metro.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/subtrack-native-proof/private/metro.pid")" || true
          fi
          if [[ -n "${SUBTRACK_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SUBTRACK_SIMULATOR_UDID" || true
            xcrun simctl delete "$SUBTRACK_SIMULATOR_UDID"
          fi
