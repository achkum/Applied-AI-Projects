name: SubTrack owned browser subscription lifecycle launcher proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SubTrack/package.json'
      - 'SubTrack/pnpm-lock.yaml'
      - 'SubTrack/pnpm-workspace.yaml'
      - 'SubTrack/apps/api/package.json'
      - 'SubTrack/apps/api/tsconfig*.json'
      - 'SubTrack/packages/config/**'
      - 'SubTrack/packages/contracts/**'
      - 'SubTrack/packages/domain/**'
      - 'SubTrack/apps/api/src/**'
      - 'SubTrack/apps/api/src/auth/**'
      - 'SubTrack/apps/api/src/database/**'
      - 'SubTrack/apps/api/prisma/**'
      - 'SubTrack/apps/api/test/browser-subscription-lifecycle-launcher.integration.ts'
      - 'SubTrack/apps/api/test/browser-subscription-lifecycle.integration.ts'
      - 'SubTrack/apps/api/test/vitest.browser-subscription-lifecycle.config.ts'
      - 'SubTrack/packages/ui/package.json'
      - 'SubTrack/apps/api/test/vitest.browser-subscription-lifecycle-launcher.config.ts'
      - 'SubTrack/apps/api/vitest.config.ts'
      - 'SubTrack/tools/database/browser-subscription-lifecycle-launcher-proof.sh'
      - 'SubTrack/tools/database/test-browser-subscription-lifecycle-launcher-proof.sh'
      - '.github/workflows/subtrack-browser-subscription-lifecycle-launcher-proof.yml'
permissions:
  contents: read
jobs:
  owned-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Install lockfile-pinned Chromium
        run: pnpm --filter @subtrack/ui exec playwright install --with-deps chromium
      - name: Missing ownership record denies proof PASS
        run: bash tools/database/test-browser-subscription-lifecycle-launcher-proof.sh
      - name: Owned PG16, compiled Node HTTPS persistence proof
        run: bash tools/database/browser-subscription-lifecycle-launcher-proof.sh
      - name: Cleanup exact recorded container
        if: always()
        run: bash tools/database/browser-subscription-lifecycle-launcher-proof.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st226-lifecycle-launcher-${{ github.sha }}
          path: ${{ runner.temp }}/st226-proof-receipt.txt
          if-no-files-found: error
          retention-days: 7
