name: SubTrack private HTTPS profile preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SubTrack/apps/api/**'
      - 'SubTrack/apps/web/**'
      - 'SubTrack/packages/contracts/**'
      - 'SubTrack/packages/i18n/**'
      - 'SubTrack/packages/money/**'
      - 'SubTrack/tools/database/private-profile-proof.sh'
      - 'SubTrack/apps/web/test/private-https-preflight.mjs'
      - 'SubTrack/tools/browser/private-https-preflight.sh'
      - 'SubTrack/apps/web/package.json'
      - 'SubTrack/pnpm-lock.yaml'
      - '.github/workflows/subtrack-private-https-profile-proof.yml'
permissions:
  contents: read
jobs:
  private-https-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Install task Firefox and NSS tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          pnpm --filter @subtrack/web exec playwright install firefox --with-deps
          test "$(pnpm --filter @subtrack/web exec node -p "require('playwright/package.json').version")" = 1.63.0
          command -v certutil >/dev/null
      - name: Build real Next register page
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @subtrack/web build
      - name: Direct TLS, Firefox trust and negative browser proof
        env:
          ST237_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=0
          bash tools/browser/private-https-preflight.sh > "$RUNNER_TEMP/st237-private-https-receipt.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/st237-private-https-receipt.txt"
          exit "$code"
      - name: Publish sanitized preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st237-private-https-receipt
          path: ${{ runner.temp }}/st237-private-https-receipt.txt
          if-no-files-found: ignore
  enrollment-profile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        locale: [sv, en]
        theme: [light, dark]
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --global pnpm@12.6.0
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm install --frozen-lockfile
      - name: Install confined Firefox trust tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          pnpm --filter @subtrack/web exec playwright install firefox --with-deps
      - name: Build private API and validate web assets
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @subtrack/api build
          pnpm --filter @subtrack/web build
          node apps/web/test/private-https-preflight.mjs revision-catalog
      - name: Actual separate ordinary schema and owner policy
        env:
          ST237_ORDINARY_PROFILE_CATALOG_OUT: ${{ runner.temp }}/st237-ordinary-profile-catalog.json
        run: bash tools/database/clean-migration-proof.sh
      - name: Actual private PG16 and natural enrollment-profile browser
        env:
          ST237_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ST237_BROWSER_LOCALE: ${{ matrix.locale }}
          ST237_BROWSER_THEME: ${{ matrix.theme }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          code=0
          : > "$RUNNER_TEMP/st237-profile-receipt.txt"
          for proof_case in edit manual profile partial-terminal empty subscriptions uncertainty login; do
            bash tools/database/private-profile-proof.sh --case "$proof_case" >> "$RUNNER_TEMP/st237-profile-receipt.txt" 2>&1 || code=$?
            (( code == 0 )) || break
          done
          if (( code == 0 )); then
            for proof_case in profile partial-terminal empty subscriptions uncertainty login manual edit; do
              grep -qx "PASS ST237_PRIVATE_CASE case=$proof_case" "$RUNNER_TEMP/st237-profile-receipt.txt" || code=1
            done
          fi
          cat "$RUNNER_TEMP/st237-profile-receipt.txt"
          exit "$code"
      - name: Publish sanitized private profile receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st237-profile-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-receipt.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish synthetic browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st237-profile-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/profile/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish synthetic partial terminal review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st237-partial-terminal-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/partial-terminal/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish synthetic owner subscription review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st238-subscriptions-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/subscriptions/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish synthetic empty owner list review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st238-empty-owner-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/empty/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish uncertain commit review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st238-uncertainty-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/uncertainty/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish returning login review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st239-login-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/login/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish natural manual Add review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st240-manual-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/manual/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish natural manual Edit review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st241-edit-screenshots-${{ matrix.locale }}-${{ matrix.theme }}
          path: ${{ runner.temp }}/st237-profile-screenshots/edit/*.png
          if-no-files-found: error
          retention-days: 7
