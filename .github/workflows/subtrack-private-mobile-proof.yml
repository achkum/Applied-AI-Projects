name: SubTrack private mobile PostgreSQL proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SubTrack/apps/api/**'
      - 'SubTrack/packages/contracts/**'
      - 'SubTrack/tools/database/private-mobile*.sh'
      - 'SubTrack/pnpm-lock.yaml'
      - '.github/workflows/subtrack-private-mobile-proof.yml'
permissions:
  contents: read
jobs:
  private-mobile-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SubTrack
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.6.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Validate API types and source
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: corepack pnpm --filter @subtrack/api typecheck
      - name: Validate local daemon readiness descriptor custody
        run: bash tools/database/private-mobile-descriptor.spec.sh
      - name: Actual owned PG16 direct TLS mobile behavior
        run: bash tools/database/private-mobile-qualify.sh
      - name: Publish sanitized backend proof and verified cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st244-private-mobile-postgresql-receipt-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/st244-private-mobile-receipt.json
          if-no-files-found: ignore
