---
# Learning-rate schedule for ai8x-training: halve the learning rate at epochs 15, 25 and 35.
lr_schedulers:
  training_lr:
    class: MultiStepLR
    milestones: [15, 25, 35]
    gamma: 0.5

policies:
  - lr_scheduler:
      instance_name: training_lr
    starting_epoch: 0
    ending_epoch: 40
    frequency: 1
